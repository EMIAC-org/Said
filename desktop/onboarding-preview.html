<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AirNote · Onboarding Preview</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
/* ════════════════════════════════════════════════════════════════════════
   Design tokens — copied verbatim from desktop/src/styles.css (DARK theme)
   ════════════════════════════════════════════════════════════════════════ */
:root {
  --background:           240 8% 2.5%;
  --foreground:           240 6% 93%;
  --primary:              226 92% 79%;
  --primary-foreground:   240 8% 8%;
  --accent-violet:        226 92% 79%;
  --muted-foreground:     240 5% 60%;
  --accent:               226 80% 78%;
  --destructive:          354 80% 62%;
  --border:               240 5% 18%;
  --surface-1:            235 8% 6.5%;
  --surface-2:            240 7% 3.5%;
  --surface-3:            240 5% 9.5%;
  --surface-4:            240 5% 15%;
  --surface-hover:        240 5% 13%;
  --glass-stroke:         0 0% 100% / 0.075;
  --glass-stroke-strong:  0 0% 100% / 0.12;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: hsl(240 8% 4%);
  color: hsl(var(--foreground));
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
               "Inter", "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
  font-feature-settings: "ss01", "cv11", "rlig" 1, "calt" 1;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ── Preview chrome ─────────────────────────────────────────────────── */
.preview-head {
  max-width: 1200px;
  margin: 0 auto;
  padding: 36px 28px 8px;
}
.preview-head h1 {
  font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 6px;
}
.preview-head p {
  font-size: 13px; color: hsl(var(--muted-foreground)); margin: 0; line-height: 1.6;
}
.preview-stack {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px 28px 80px;
  display: flex;
  flex-direction: column;
  gap: 40px;
}
.preview-card { display: flex; flex-direction: column; gap: 10px; }
.preview-label {
  display: flex; align-items: center; gap: 10px;
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em;
  color: hsl(var(--muted-foreground));
}
.preview-label .num {
  display: inline-grid; place-items: center;
  width: 22px; height: 22px; border-radius: 7px;
  background: hsl(var(--primary) / 0.14); color: hsl(var(--primary));
  font-size: 11px; font-weight: 700;
}
.preview-label .sub { color: hsl(var(--muted-foreground) / 0.6); font-weight: 600; text-transform: none; letter-spacing: 0; }
.preview-frame {
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 30px 80px hsl(0 0% 0% / 0.55), inset 0 0 0 1px hsl(0 0% 100% / 0.06);
}

/* ════════════════════════════════════════════════════════════════════════
   Onboarding layout — copied from styles.css (.onb-*)
   In-app this is height:100vh; here we fix the height so cards stack.
   ════════════════════════════════════════════════════════════════════════ */
.onb-split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  height: 720px;
  width: 100%;
  overflow: hidden;
}
.onb-brand {
  position: relative;
  background:
    radial-gradient(80% 60% at 30% 30%, hsl(226 80% 60% / 0.12), transparent 55%),
    radial-gradient(60% 50% at 80% 80%, hsl(220 60% 50% / 0.08), transparent 60%),
    linear-gradient(180deg, hsl(240 6% 4% / 0.86) 0%, hsl(240 6% 6% / 0.88) 100%);
  border-right: 1px solid hsl(0 0% 100% / 0.04);
  display: flex;
  flex-direction: column;
  padding: 28px 36px;
  overflow: hidden;
}
.onb-brand::after {
  content: "";
  position: absolute; inset: 0;
  background: repeating-linear-gradient(0deg, transparent 0, transparent 3px,
                hsl(0 0% 100% / 0.012) 3px, hsl(0 0% 100% / 0.012) 4px);
  pointer-events: none;
  mix-blend-mode: overlay;
}
.onb-brand-mark {
  width: 108px; height: 108px;
  border-radius: 26px;
  position: relative;
  display: grid; place-items: center;
  background:
    radial-gradient(circle at 50% 30%, hsl(226 80% 78% / 0.10), transparent 60%),
    linear-gradient(160deg, hsl(240 6% 14%) 0%, hsl(240 6% 7%) 100%);
  box-shadow:
    0 24px 60px hsl(0 0% 0% / 0.55),
    inset 0 0 0 1px hsl(0 0% 100% / 0.07),
    inset 0 1px 0 hsl(0 0% 100% / 0.04);
  color: hsl(0 0% 96%);
}
.onb-form {
  position: relative;
  background: hsl(240 5% 6% / 0.84);
  display: flex;
  flex-direction: column;
  padding: 28px 56px;
  overflow-y: auto;
}

/* Brand panel inner (was inline styles in OnboardingShell.tsx) */
.brand-top { position: relative; z-index: 1; display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 500; color: hsl(var(--foreground)); }
.brand-top .mk { width: 18px; height: 18px; display: inline-grid; place-items: center; color: hsl(var(--foreground)); }
.brand-center { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; text-align: center; }
.brand-name { font-size: 44px; font-weight: 500; letter-spacing: -0.035em; line-height: 1; color: hsl(var(--foreground)); }
.brand-tagline { font-size: 13.5px; color: hsl(var(--muted-foreground)); line-height: 1.55; max-width: 280px; margin: 12px auto 0; }
.brand-foot { position: relative; z-index: 1; padding-top: 16px; border-top: 1px solid hsl(var(--border)); }
.brand-kicker { display: block; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; margin-bottom: 6px; color: hsl(var(--muted-foreground)); }
.brand-quote { font-size: 12.5px; font-style: italic; line-height: 1.6; color: hsl(var(--foreground) / 0.85); margin: 0; }

/* Form panel inner */
.form-header { display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; min-height: 36px; }
.form-topright { font-size: 11.5px; color: hsl(var(--muted-foreground) / 0.7); }
.back-btn {
  display: flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; border-radius: 8px;
  color: hsl(var(--muted-foreground));
  border: 1px solid transparent; background: transparent; cursor: pointer;
  transition: all .12s ease;
}
.back-btn:hover { color: hsl(var(--foreground)); background: hsl(0 0% 100% / 0.04); border-color: hsl(var(--glass-stroke-strong)); }
.form-body { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 440px; width: 100%; margin: 0 auto; padding: 24px 0; }
.eyebrow { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.16em; margin: 0 0 12px; color: hsl(var(--primary)); }
.onb-title { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.025em; line-height: 1.18; color: hsl(var(--foreground)); }
.onb-subtitle { margin: 12px 0 0; font-size: 13.5px; color: hsl(var(--muted-foreground)); line-height: 1.6; }
.form-foot { display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
.bottom-note-row { display: flex; align-items: center; justify-content: flex-end; min-height: 24px; }
.bottom-note-row span { font-size: 11px; color: hsl(var(--muted-foreground) / 0.6); }

/* Step nav */
.onb-stepnav { display: flex; gap: 4px; width: 100%; max-width: 440px; margin: 0 auto; padding-top: 4px; }
.onb-stepnav-pill {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 6px 2px 5px; border-radius: 8px;
  border: 1px solid transparent; background: transparent;
  color: hsl(var(--muted-foreground) / 0.55);
  font-size: 9px; font-weight: 600; letter-spacing: 0.02em; line-height: 1.1;
  font-family: inherit; cursor: default;
}
.onb-stepnav-clickable { cursor: pointer; color: hsl(var(--muted-foreground) / 0.85); }
.onb-stepnav-current { color: hsl(var(--primary)); background: hsl(var(--primary) / 0.08); border-color: hsl(var(--primary) / 0.25); }
.onb-stepnav-done { color: hsl(140 55% 58% / 0.9); }
.onb-stepnav-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.7; }
.onb-stepnav-label { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; }

/* Onboarding rows */
.onb-row {
  display: grid; grid-template-columns: 32px 1fr auto; align-items: center; gap: 12px;
  padding: 12px; border-radius: 8px;
  background: hsl(0 0% 100% / 0.025);
  box-shadow: inset 0 0 0 1px hsl(var(--glass-stroke));
}
.onb-row + .onb-row { margin-top: 8px; }
.onb-row.selectable { cursor: pointer; transition: background .12s ease, box-shadow .12s ease; }
.onb-row.selectable:hover { background: hsl(0 0% 100% / 0.05); }
.onb-row.selected { background: hsl(var(--primary) / 0.10); box-shadow: inset 0 0 0 1px hsl(var(--primary) / 0.35); }
.onb-row .ico-wrap {
  width: 32px; height: 32px; border-radius: 8px;
  background: hsl(0 0% 100% / 0.04);
  box-shadow: inset 0 0 0 1px hsl(var(--glass-stroke));
  display: grid; place-items: center; color: hsl(var(--foreground));
}
.onb-row .row-title { font-size: 12.5px; font-weight: 500; color: hsl(var(--foreground)); }
.onb-row .row-desc { font-size: 11.5px; color: hsl(var(--muted-foreground)); margin-top: 2px; line-height: 1.4; }

.key-glyph {
  width: 40px; height: 40px; border-radius: 9px;
  background: hsl(0 0% 100% / 0.05);
  box-shadow: inset 0 0 0 1px hsl(var(--glass-stroke-strong)), 0 1px 0 hsl(0 0% 0% / 0.4);
  display: grid; place-items: center; color: hsl(var(--foreground));
  font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  font-size: 13px; font-weight: 500;
}

/* Buttons */
.btn-primary {
  background: hsl(0 0% 98%); color: hsl(240 8% 8%);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
  border: none; cursor: pointer; transition: all .15s; height: 36px; font-family: inherit;
  box-shadow: inset 0 1px 0 hsl(0 0% 100% / 0.8), 0 1px 2px hsl(0 0% 0% / 0.2), 0 6px 16px hsl(0 0% 0% / 0.18);
}
.btn-primary:hover { background: hsl(0 0% 100%); }
.btn-primary:disabled { background: hsl(var(--surface-4)); color: hsl(var(--muted-foreground)); box-shadow: none; cursor: not-allowed; }
.btn-lg { height: 42px; font-size: 13.5px; padding-left: 20px; padding-right: 20px; }
.w-full { width: 100%; }
.btn-ghost {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 6px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 500;
  color: hsl(var(--foreground)); background: transparent; cursor: pointer; font-family: inherit;
  box-shadow: inset 0 0 0 1px hsl(var(--border)); height: 36px; transition: all .15s;
}
.btn-ghost:hover { background: hsl(0 0% 100% / 0.04); box-shadow: inset 0 0 0 1px hsl(var(--glass-stroke-strong)); }

/* Inputs */
.input {
  width: 100%; font-size: 13px; border-radius: 8px; padding: 10px 12px;
  background: hsl(0 0% 0% / 0.25); color: hsl(var(--foreground));
  border: 1px solid hsl(var(--border)); font-family: inherit; transition: border-color .12s;
}
.input::placeholder { color: hsl(var(--muted-foreground) / 0.6); }
.input:focus { outline: none; background: hsl(0 0% 0% / 0.35); border-color: hsl(var(--primary) / 0.45); box-shadow: 0 0 0 3px hsl(var(--primary) / 0.10); }

/* Pills / badges */
.accent-pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
  padding: 2px 8px; border-radius: 999px;
  background: hsl(var(--primary) / 0.14); color: hsl(var(--primary));
}
.granted-pill { color: hsl(140 65% 65%); background: hsl(140 65% 50% / 0.14); }

.panel {
  background: hsl(var(--surface-3));
  border-radius: 12px;
  box-shadow: inset 0 0 0 1px hsl(var(--border)), 0 1px 0 hsl(0 0% 100% / 0.04);
}

/* Brand mark */
.bars-mark { fill: currentColor; display: block; }

/* utility */
.mt-7 { margin-top: 28px; } .mt-6 { margin-top: 24px; } .mt-3 { margin-top: 12px; } .mt-1 { margin-top: 4px; }
.mb-3 { margin-bottom: 12px; } .mb-15 { margin-bottom: 6px; }
.flex { display: flex; } .flex-col { flex-direction: column; } .items-center { align-items: center; }
.justify-between { justify-content: space-between; } .justify-end { justify-content: flex-end; } .justify-center { justify-content: center; }
.gap-2 { gap: 8px; } .gap-25 { gap: 10px; } .gap-3 { gap: 12px; } .gap-4 { gap: 16px; }
.text-accent { color: hsl(var(--accent)); font-weight: 600; }
.text-muted { color: hsl(var(--muted-foreground)); }
.divider { display: flex; align-items: center; gap: 12px; margin: 4px 0; }
.divider .line { height: 1px; flex: 1; background: hsl(var(--border)); }
.divider .or { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: hsl(var(--muted-foreground)); }
</style>
</head>
<body>

<div class="preview-head">
  <h1>AirNote · Onboarding Preview</h1>
  <p>Pixel-faithful static render of every onboarding screen (macOS full flow). Pulled directly from <code>OnboardingFlow.tsx</code> + <code>OnboardingShell.tsx</code> + <code>styles.css</code>. This is the iteration surface — we refine the design here, then port back into the components.</p>
</div>

<div class="preview-stack" id="stack"></div>

<!-- Brand mark template -->
<template id="brandmark-tpl">
  <svg viewBox="0 0 24 24" class="bars-mark" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect x="3"  y="8.5" width="3" height="7"  rx="1.5" />
    <rect x="8"  y="4.5" width="3" height="15" rx="1.5" />
    <rect x="13" y="2.5" width="3" height="19" rx="1.5" />
    <rect x="18" y="6.5" width="3" height="11" rx="1.5" />
  </svg>
</template>

<script>
/* ──────────────────────────────────────────────────────────────────────────
   Faithful builders mirroring OnboardingShell.tsx + OnboardingFlow.tsx
   ────────────────────────────────────────────────────────────────────────── */

const STEPS = [
  { id: "welcome",     label: "Welcome" },
  { id: "account",     label: "Account" },
  { id: "permissions", label: "Permissions" },
  { id: "keys",        label: "Keys" },
  { id: "hotkey",      label: "Hotkey" },
];

function brandMark(size) {
  const tpl = document.getElementById("brandmark-tpl").content.firstElementChild.cloneNode(true);
  tpl.setAttribute("width", size);
  tpl.setAttribute("height", size);
  return tpl.outerHTML;
}

// stepnav: statuses keyed by step id → "done" | "current" | "pending"
function stepnav(statuses) {
  return `<nav class="onb-stepnav" aria-label="Onboarding steps">${STEPS.map((s) => {
    const st = statuses[s.id] ?? "pending";
    const cls = st === "current" ? "onb-stepnav-current" : st === "done" ? "onb-stepnav-done" : "";
    const inner = st === "done"
      ? `<i data-lucide="check" style="width:10px;height:10px;stroke-width:2.5"></i>`
      : `<span class="onb-stepnav-dot"></span>`;
    return `<button class="onb-stepnav-pill ${cls}"><span style="display:flex">${inner}</span><span class="onb-stepnav-label">${s.label}</span></button>`;
  }).join("")}</nav>`;
}

// Full split-screen shell
function shell({ stepIndex, eyebrow, title, subtitle, brandTagline, brandKicker, brandQuote,
                 topRight, bottomNote, back, statuses, body }) {
  return `
  <div class="onb-split">
    <div class="onb-brand">
      <div class="brand-top"><span class="mk">${brandMark(18)}</span>AirNote</div>
      <div class="brand-center">
        <span class="onb-brand-mark">${brandMark(64)}</span>
        <div>
          <div class="brand-name">AirNote</div>
          <p class="brand-tagline">${brandTagline}</p>
        </div>
      </div>
      <div class="brand-foot">
        <span class="brand-kicker">${brandKicker}</span>
        <p class="brand-quote">&ldquo;${brandQuote}&rdquo;</p>
      </div>
    </div>
    <div class="onb-form">
      <div class="form-header">
        ${back ? `<button class="back-btn" aria-label="Back"><i data-lucide="arrow-left" style="width:14px;height:14px"></i></button>` : `<span></span>`}
        <div class="form-topright">${topRight ?? ""}</div>
      </div>
      <div class="form-body">
        <p class="eyebrow">${eyebrow}</p>
        <h1 class="onb-title">${title}</h1>
        <p class="onb-subtitle">${subtitle}</p>
        ${body}
      </div>
      <div class="form-foot">
        ${stepnav(statuses)}
        <div class="bottom-note-row"><span>${bottomNote ?? `Step ${stepIndex + 1} of 5`}</span></div>
      </div>
    </div>
  </div>`;
}

function permRow({ icon, title, desc, granted }) {
  return `
  <div class="onb-row">
    <span class="ico-wrap"><i data-lucide="${icon}" style="width:15px;height:15px"></i></span>
    <div>
      <div class="row-title">${title}</div>
      <div class="row-desc">${desc}</div>
    </div>
    ${granted
      ? `<span class="accent-pill granted-pill">Granted</span>`
      : `<button class="btn-ghost" style="height:28px;font-size:11.5px">Allow</button>`}
  </div>`;
}

function hotkeyRow({ glyph, title, desc, selected }) {
  return `
  <div class="onb-row selectable ${selected ? "selected" : ""}">
    <span class="key-glyph">${glyph}</span>
    <div>
      <div class="row-title">${title}</div>
      <div class="row-desc">${desc}</div>
    </div>
    ${selected
      ? `<i data-lucide="check" style="width:14px;height:14px;color:hsl(var(--primary))"></i>`
      : `<i data-lucide="arrow-right" style="width:14px;height:14px;color:hsl(var(--muted-foreground) / 0.6)"></i>`}
  </div>`;
}

/* ── Screen bodies ──────────────────────────────────────────────────────── */

const welcomeBody = `
  <div class="mt-7 flex flex-col" style="gap:10px">
    <button class="btn-primary btn-lg w-full">Get started <i data-lucide="arrow-right" style="width:14px;height:14px"></i></button>
  </div>`;

const accountPersonalBody = `
  <div class="mt-7 flex flex-col gap-3">
    <div class="flex items-center justify-end">
      <button class="text-accent" style="font-size:11px;background:none;border:none;cursor:pointer;font-family:inherit">Already have an account? Log in</button>
    </div>
    <input class="input" type="email" placeholder="you@company.com" />
    <input class="input" type="password" placeholder="Password (8+ characters)" />
    <button class="btn-primary btn-lg w-full"><i data-lucide="arrow-right" style="width:14px;height:14px"></i> Create account</button>
    <div class="divider"><span class="line"></span><span class="or">or</span><span class="line"></span></div>
    <button class="w-full" style="border-radius:8px;border:1px solid hsl(var(--border));padding:10px 12px;font-size:12px;font-weight:600;color:hsl(var(--foreground));background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit">
      Setting up for your organization? <span style="color:hsl(var(--primary))">Connect a workspace &rarr;</span>
    </button>
  </div>`;

const accountWorkspaceBody = `
  <div class="mt-7 flex flex-col gap-3">
    <div class="flex items-center gap-2">
      <input class="input" type="url" placeholder="http://localhost:3100" style="flex:1;font-size:12px" />
      <button class="btn-primary" style="flex-shrink:0">Connect</button>
    </div>
    <div class="panel" style="padding:24px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;background:hsl(0 0% 100% / 0.025)">
      <div style="width:46px;height:46px;border-radius:12px;background:hsl(var(--surface-4));display:grid;place-items:center;color:hsl(var(--primary))">
        <i data-lucide="link" style="width:22px;height:22px"></i>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px">
        <p style="font-size:14px;font-weight:600;color:hsl(var(--foreground));margin:0">Sign in with Lark</p>
        <p style="font-size:12px;color:hsl(var(--muted-foreground));line-height:1.5;max-width:260px;margin:0">Use your organization&rsquo;s Lark account. We&rsquo;ll open Lark in your browser and connect automatically.</p>
      </div>
      <button class="w-full" style="border-radius:12px;padding:10px 16px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1a1a1a;border:none;cursor:pointer;font-family:inherit;box-shadow:0 6px 18px -8px rgba(0,0,0,0.55)">
        <i data-lucide="link" style="width:18px;height:18px"></i> Continue with Lark
      </button>
    </div>
  </div>`;

const permissionsBody = `
  <div class="mt-7">
    ${permRow({ icon: "mic",      title: "Microphone",       desc: "Capture audio while you hold the hotkey.",                              granted: true })}
    ${permRow({ icon: "shield",   title: "Accessibility",    desc: "Type polished text into the focused app.",                             granted: false })}
    ${permRow({ icon: "keyboard", title: "Input Monitoring", desc: "Hear your hotkey from any app — even when AirNote isn’t focused.",      granted: false })}
  </div>
  <div class="mt-6">
    <button class="btn-primary btn-lg w-full" disabled>Waiting for grants…</button>
  </div>`;

const keysBody = `
  <div class="mt-7 flex flex-col gap-3">
    <!-- On-device (recommended) -->
    <div style="border-radius:12px;padding:16px;border:1px solid hsl(var(--primary) / 0.4);background:hsl(var(--primary) / 0.04)">
      <div class="flex items-center justify-between" style="margin-bottom:6px">
