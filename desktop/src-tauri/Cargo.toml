[package]
name              = "said-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
dotenvy    = { workspace = true }
tauri      = { version = "2.0.0", features = ["tray-icon", "image-png", "macos-private-api"] }
uuid       = { workspace = true }
tokio      = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }

# Async HTTP for backend SSE consumption (Phase E)
reqwest  = { workspace = true, features = ["blocking"] }
futures  = "0.3"
bytes    = "1"
tracing  = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }

# Deepgram live streaming SDK (wrapped by dg_stream's session actor)
deepgram = "0.10"
rustls   = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }

# Open URLs in the system default browser (for OpenAI OAuth)
open = "5"

# Resolve platform-specific directories (audio retry files)
dirs = "5"
signal-hook = "0.3"
sysinfo = "0.32"

# Native OS notifications via the official Tauri plugin
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Workspace crates
said-core     = { path = "../../crates/core" }
said-hotkey   = { path = "../../crates/hotkey" }
said-paster   = { path = "../../crates/paster" }
said-recorder = { path = "../../crates/recorder" }

# Recording (still needed; cpal uses its own thread model)
cpal  = "0.15"
hound = "3.5"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa           = "0.26"
objc            = "0.2"
core-graphics   = "0.24"
core-foundation = "0.10"
dispatch        = "0.2"
libc            = "0.2"
block           = "0.1"

# Windows — Job Objects so the said-backend child dies when the desktop
# parent process is terminated (Task Manager kill, crash, force-uninstall).
# Without this, the backend orphans and holds a file lock on said-backend.exe.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    # CreateJobObjectW takes a SECURITY_ATTRIBUTES* and the windows-rs crate
    # gates that signature behind Win32_Security. Without it the symbol
    # exists only as a `#[cfg]`-disabled stub and import resolution fails.
    "Win32_Security",
] }
