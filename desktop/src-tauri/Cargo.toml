[package]
name              = "said-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
dotenvy    = { workspace = true }
tauri      = { version = "2.0.0", features = ["protocol-asset", "tray-icon", "image-png", "macos-private-api"] }
uuid       = { workspace = true }
tokio      = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }

# Async HTTP for backend SSE consumption (Phase E)
reqwest  = { workspace = true, features = ["blocking"] }
futures  = "0.3"

tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
bytes    = "1"
tracing  = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }

rustls   = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }

# Open URLs in the system default browser (for OpenAI OAuth)
open = "5"

# Resolve platform-specific directories (audio retry files)
dirs = "5"
signal-hook = "0.3"
sysinfo = "0.32"

# Native OS notifications via the official Tauri plugin
tauri-plugin-notification = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2.5.1"

# Workspace crates
said-core     = { path = "../../crates/core" }
# On-device dictation ASR core. Default features = CPU in-process engine; macOS
# adds `metal` below. The Vulkan GPU path is NOT here — it lives only in the
# isolated `airnote-asr-gpu` sidecar, so the app links no Vulkan loader.
asr-core      = { path = "../../crates/asr-core" }
said-hotkey   = { path = "../../crates/hotkey" }
said-paster   = { path = "../../crates/paster" }
said-recorder = { path = "../../crates/recorder" }
# Cloud STT owns the DeepInfra Whisper batch transport shared by macOS and Windows.
asr-cloud     = { path = "../../crates/asr-cloud" }

# Recording (still needed; cpal uses its own thread model)
cpal  = "0.15"
hound = "3.5"
# Generic GGUF ASR runtime used only by the optional Nemotron provider.  Keep
# default features off: platform tables below opt into the backend that is safe
# to ship for that platform.
transcribe-cpp = { version = "0.1.3", default-features = false }
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa           = "0.26"
objc            = "0.2"
core-graphics   = "0.24"
core-foundation = "0.10"
dispatch        = "0.2"
libc            = "0.2"
block           = "0.1"
tauri-nspanel   = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
screencapturekit = { version = "6.1.0", features = ["macos_13_0"] }
# macOS runs the in-process ASR engine on Metal (reliable; no worker process).
asr-core        = { path = "../../crates/asr-core", features = ["metal"] }
transcribe-cpp  = { version = "0.1.3", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Keep the first Windows release CPU-only. The existing Whisper Vulkan worker
# is deliberately process-isolated; loading a second GGML/Vulkan runtime in
# the desktop process would undermine that crash boundary. A future dedicated
# Nemotron worker can opt into transcribe-cpp's dynamic Vulkan backend.
transcribe-cpp = { version = "0.1.3", default-features = false }
# NOTE: the desktop app no longer links whisper/Vulkan directly. On-device
# dictation runs through `asr-core` — CPU in-process here — while the GPU (Vulkan)
# path lives entirely in the isolated `airnote-asr-gpu` sidecar. The app therefore
# has no vulkan-1.dll dependency, and a GPU/driver crash cannot take it down.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Threading", # app_identity: OpenProcess + QueryFullProcessImageNameW (pid → exe)
    "Win32_UI_WindowsAndMessaging", # browser_context: GetForegroundWindow (UIA capture root)
] }
# App Identity Service icon path (exe → PNG). Does the HICON→PNG dance internally.
# VERSION UNVERIFIED from this macOS dev box — confirm on the first Windows build.
windows-icons = "0.1"
# browser_context: read the foreground browser's omnibox URL via UI Automation
# (no OS permission required on Windows, unlike macOS Apple Events). UNVERIFIED
# from this macOS box — the UIA call sites compile only on the first Windows build.
uiautomation = "0.25"
