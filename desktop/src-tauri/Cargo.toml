[package]
name              = "said-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
dotenvy    = { workspace = true }
tauri      = { version = "2.0.0", features = ["tray-icon", "image-png", "macos-private-api"] }
uuid       = { workspace = true }
tokio      = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }

# Async HTTP for backend SSE consumption (Phase E)
reqwest  = { workspace = true, features = ["blocking"] }
futures  = "0.3"
bytes    = "1"
tracing  = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }

# WebSocket client for Deepgram live streaming (P5).
# rustls-tls (not native-tls) — same reasoning as workspace `reqwest`:
# avoid SChannel/SecureTransport cert-chain failures with Deepgram.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }

# Open URLs in the system default browser (for OpenAI OAuth)
open = "5"

# Resolve platform-specific directories (audio retry files)
dirs = "5"
sysinfo = "0.32"

# Native OS notifications via the official Tauri plugin
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
# Auto-update via Tauri's built-in updater plugin. The actual endpoint and
# public key live in `tauri.conf.json` under `plugins.updater`. See
# scripts/release/README.md for how to generate the EdDSA keypair and
# wire the GitHub secrets.
tauri-plugin-updater = "2"

# Workspace crates
said-core     = { path = "../../crates/core" }
said-paster   = { path = "../../crates/paster" }
said-recorder = { path = "../../crates/recorder" }
# said-hotkey is now cross-platform after the P0 refactor (Windows is
# stubbed scaffolding until P2; macOS keeps the real CGEventTap impl).
said-hotkey   = { path = "../../crates/hotkey" }

# Recording (still needed; cpal uses its own thread model)
cpal  = "0.15"
hound = "3.5"

# Unix-only signal handling (SIGTERM / SIGINT graceful shutdown).
# Windows uses Ctrl-C handler via `tokio::signal::ctrl_c()` — see main.rs.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa           = "0.26"
objc            = "0.2"
core-graphics   = "0.24"
core-foundation = "0.10"
dispatch        = "0.2"
libc            = "0.2"
block           = "0.1"
