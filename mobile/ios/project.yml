name: AirNote
options:
  bundleIdPrefix: com.emiac.airnote
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
configs:
  Debug: debug
  Staging: release
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Staging: Config/Staging.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    DEVELOPMENT_TEAM: 96ZQGP7L3B
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "18"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
packages: {}
targets:
  AirNoteShared:
    type: framework
    platform: iOS
    sources:
      - path: AirNoteShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emiac.airnote.ios.shared
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  AirNoteKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: AirNoteKeyboard
    dependencies:
      # Link, but DO NOT embed — the extension finds AirNoteShared in the host
      # app's Frameworks at runtime. Embedding it here produced a forbidden
      # Frameworks folder + duplicate bundle-id in the .appex (App Store reject).
      - target: AirNoteShared
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emiac.airnote.ios.keyboard
        CODE_SIGN_ENTITLEMENTS: AirNoteKeyboard/Resources/AirNoteKeyboard.entitlements
        INFOPLIST_FILE: AirNoteKeyboard/Resources/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../../Frameworks"

  AirNote:
    type: application
    platform: iOS
    sources:
      - path: AirNoteApp
    dependencies:
      - target: AirNoteShared
        embed: true
      - target: AirNoteKeyboard
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emiac.airnote.ios
        CODE_SIGN_ENTITLEMENTS: AirNoteApp/Resources/AirNoteApp.entitlements
        INFOPLIST_FILE: AirNoteApp/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"

  AirNoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AirNoteUITests
    dependencies:
      - target: AirNote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emiac.airnote.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AirNote

  AirNoteSharedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AirNoteSharedTests
    dependencies:
      - target: AirNoteShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emiac.airnote.ios.sharedtests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AirNote:
    build:
      targets:
        AirNote: all
        AirNoteKeyboard: all
        AirNoteShared: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AirNoteSharedTests
        - AirNoteUITests
    archive:
      config: Release

  AirNote-Staging:
    build:
      targets:
        AirNote: all
        AirNoteKeyboard: all
        AirNoteShared: all
    run:
      config: Staging
    archive:
      config: Staging
