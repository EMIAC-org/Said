# Standalone workspace — control-plane is intentionally NOT a member of the
# top-level Cargo workspace (its sqlx-postgres feature conflicts with
# rusqlite's libsqlite3-sys). The empty `[workspace]` table below tells cargo
# this crate is its own root; without it, cargo walks up to find the parent
# Cargo.toml and gets confused under git worktrees.
[workspace]

[package]
name    = "said-control-plane"
version = "2.2.5"
edition = "2024"

[[bin]]
name = "control-plane"
path = "src/main.rs"

# Standalone-crate lint policy. Mirrors [workspace.lints] in the top-level
# Cargo.toml — keep them aligned by hand since this crate isn't a workspace
# member.
[lints.rust]
unexpected_cfgs = "allow"
dead_code       = "allow"

[lints.clippy]
collapsible_if              = "allow"
doc_lazy_continuation       = "allow"
doc_overindented_list_items = "allow"
manual_char_comparison      = "allow"
too_many_arguments          = "allow"
type_complexity             = "allow"

# ── Dependencies ──────────────────────────────────────────────────────────────

[dependencies]
axum               = { version = "0.7", features = ["ws"] }
tokio              = { version = "1", features = ["full"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy            = "0.15"
clap               = { version = "4", features = ["derive", "env"] }
uuid               = { version = "1", features = ["v4", "serde"] }
tower-http         = { version = "0.5", features = ["cors"] }

# Postgres + async driver
sqlx = { version = "0.7", default-features = false, features = [
    "postgres",
    "runtime-tokio-rustls",
    "uuid",
    "chrono",
    "macros",
] }

# Auth
argon2 = "0.5"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Enterprise — WebSocket, JWT, HTTP client
tokio-tungstenite = "0.24"
futures-util      = "0.3"
jsonwebtoken      = "9"
reqwest           = { version = "0.12", features = ["json"] }
urlencoding       = "2"

# PKCE / Codex client
sha2   = "0.10"
base64 = "0.22"
rand   = "0.8"

[dev-dependencies]
tokio-tungstenite = "0.24"
futures-util      = "0.3"
