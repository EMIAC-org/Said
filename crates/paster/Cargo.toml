[package]
name              = "said-paster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true

[lints]
workspace = true

[dependencies]
serde   = { version = "1", features = ["derive"] }
tracing = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa           = "0.26"
objc            = "0.2"
core-graphics   = "0.24"
core-foundation = "0.10"
libc            = "0.2"

# Windows only — SendInput (Unicode keyboard injection) + clipboard API +
# UI Automation client (for reading the focused control's selected text
# directly, matching Mac's Accessibility-API path; Ctrl+C clipboard
# fallback is retained for browsers/Electron which don't expose UIA
# TextPattern by default).
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_LibraryLoader",
] }
uiautomation = "0.24"
