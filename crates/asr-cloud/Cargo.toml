# Hosted (cloud) speech-to-text. The cloud counterpart of `asr-core`: where
# asr-core runs whisper on-device, this crate speaks the OpenAI-compatible
# `POST {base_url}/audio/transcriptions` protocol that DeepInfra, OpenAI, Groq
# and Fireworks all implement — so a provider is a config preset, not a client.
