[package]
name              = "said-backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true

[lib]
name = "said_backend"
path = "src/lib.rs"

[[bin]]
name = "airnote-backend"
path = "src/main.rs"

[[bin]]
name = "eval-pipeline"
path = "src/bin/eval_pipeline.rs"

[[bin]]
name = "e2e-pipeline"
path = "src/bin/e2e_pipeline.rs"

[[bin]]
name = "e2e-groq"
path = "src/bin/e2e_groq.rs"

[[bin]]
name = "pipeline-quality"
path = "src/bin/pipeline_quality.rs"

[[bin]]
name = "eval-edit-learning"
path = "src/bin/eval_edit_learning.rs"


[lints]
workspace = true

[dependencies]
axum               = { version = "0.7", features = ["multipart", "ws"] }
async-stream       = "0.3"
tokio              = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
base64            = "0.22"
tracing            = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap               = { version = "4", features = ["derive"] }
uuid               = { workspace = true }
reqwest            = { workspace = true }
chrono             = { version = "0.4", features = ["serde"] }
tokio-tungstenite  = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls             = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }

# SQLite
rusqlite    = { version = "0.31", features = ["bundled"] }
r2d2        = "0.8"
r2d2_sqlite = "0.24"

# Async utilities
futures     = "0.3"
bytes       = "1"
sha2        = "0.10"
hex         = "0.4"
tower-http  = { version = "0.5", features = ["cors"] }
tokio-util  = { version = "0.7", features = ["io"] }
anyhow      = "1"
libc        = "0.2"
regex       = "1"
once_cell   = "1"
ndarray     = "0.16"
ort         = "2.0.0-rc.12"

said-core = { path = "../core" }
dirs              = "5"
