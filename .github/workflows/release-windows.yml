name: Release (Windows)

# Triggers on any version tag (`v*`). The Mac release pipeline lives in
# release.yml; the two run in parallel from the same tag, each uploading
# its own artifacts to the same GitHub Release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: 'Cargo target triple'
        required: false
        default: 'x86_64-pc-windows-msvc'

permissions:
  contents: write       # for upload to GitHub Release
  packages: write       # in case we publish container/scoop artifacts later

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build + sign Windows installers
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: ver
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag -replace '^v',''
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Release version: $version"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build said-backend sidecar
        run: cargo build -p said-backend --release --target x86_64-pc-windows-msvc

      - name: Stage sidecar for Tauri externalBin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/src-tauri/binaries | Out-Null
          Copy-Item -Force `
            target/x86_64-pc-windows-msvc/release/said-backend.exe `
            desktop/src-tauri/binaries/said-backend-x86_64-pc-windows-msvc.exe

      - name: npm ci + build frontend
        working-directory: desktop
        run: |
          npm ci
          npm run build

      - name: Inject Tauri updater public key
        if: env.TAURI_UPDATER_PUBKEY != ''
        env:
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        shell: pwsh
        run: |
          $conf = 'desktop/src-tauri/tauri.conf.json'
          $content = Get-Content $conf -Raw
          $content = $content -replace 'TAURI_UPDATER_PUBKEY_PLACEHOLDER', $env:TAURI_UPDATER_PUBKEY
          Set-Content -NoNewline $conf $content
          Write-Host 'Tauri updater pubkey injected.'

      - name: Build Tauri (MSI + NSIS)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        working-directory: desktop
        run: npx tauri build --bundles msi,nsis --target x86_64-pc-windows-msvc

      - name: Sign installers
        if: env.WINDOWS_PFX_BASE64 != ''
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $bundle = 'desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle'
          $artifacts = @()
          if (Test-Path "$bundle/msi") {
              $artifacts += Get-ChildItem -Recurse -Filter '*.msi' "$bundle/msi" | ForEach-Object FullName
          }
          if (Test-Path "$bundle/nsis") {
              $artifacts += Get-ChildItem -Recurse -Filter '*-setup.exe' "$bundle/nsis" | ForEach-Object FullName
          }
          if ($artifacts.Count -gt 0) {
              pwsh scripts/sign-windows.ps1 -Paths $artifacts
          } else {
              Write-Warning 'No artifacts to sign.'
          }

      - name: Collect artifacts
        id: artifacts
        shell: pwsh
        run: |
          $bundle = 'desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle'
          $out = 'release-artifacts'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          if (Test-Path "$bundle/msi") {
              Copy-Item -Recurse -Force "$bundle/msi/*" $out
          }
          if (Test-Path "$bundle/nsis") {
              Copy-Item -Recurse -Force "$bundle/nsis/*" $out
          }
          # Also include the updater-signed `.sig` files Tauri emits next to
          # each installer (used by the auto-updater to verify downloads).
          Get-ChildItem -Recurse -Filter '*.sig' "$bundle" | ForEach-Object {
              Copy-Item -Force $_.FullName $out
          }
          Get-ChildItem $out

      - name: Upload artifacts (workflow)
        uses: actions/upload-artifact@v4
        with:
          name: said-windows-${{ steps.ver.outputs.version }}
          path: release-artifacts/**
          retention-days: 14

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.msi
            release-artifacts/*-setup.exe
            release-artifacts/*.sig
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: false
          generate_release_notes: true

  update-manifest:
    name: Regenerate update manifest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.UPDATE_MANIFEST_TRIGGER_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Ping Cloudflare Worker to invalidate cache
        env:
          TRIGGER_URL: ${{ vars.UPDATE_MANIFEST_TRIGGER_URL }}
          TRIGGER_TOKEN: ${{ secrets.UPDATE_MANIFEST_TRIGGER_TOKEN }}
        run: |
          curl -fsSL \
            -H "Authorization: Bearer $TRIGGER_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"event":"release","tag":"${{ github.ref_name }}"}' \
            "$TRIGGER_URL"
