name: Deploy Control Plane Dev

on:
  push:
    branches: [dev]
    paths:
      - "crates/control-plane/**"
      - "deploy/control-plane/**"
      - ".github/workflows/deploy-control-plane-dev.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-control-plane-dev
  cancel-in-progress: true

env:
  DEPLOY_PATH: /opt/said-control-plane-dev
  COMPOSE_PROJECT: airnote-control-plane-dev
  CONTROL_PLANE_PORT: "3101"
  POSTGRES_DB: said_control_plane_dev
  POSTGRES_PORT: "5433"
  POSTGRES_VOLUME_NAME: airnote-control-plane-dev_postgres-data
  DEV_DOMAIN: airnote-dev.103.180.163.41.sslip.io

jobs:
  build:
    name: Build and push dev image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Compute image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/airnote-control-plane"
          sha_tag="${image}:dev-sha-${GITHUB_SHA::12}"
          {
            echo "image=${image}"
            echo "image_tag=${sha_tag}"
            echo "tags<<EOF"
            echo "${sha_tag}"
            echo "${image}:dev-latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/control-plane/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.environment=dev
          cache-from: type=gha,scope=control-plane-dev
          cache-to: type=gha,mode=max,scope=control-plane-dev

  deploy:
    name: Deploy dev over SSH
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Validate deploy secrets
        shell: bash
        run: |
          test -n "${{ secrets.DEPLOY_HOST }}" || (echo "DEPLOY_HOST is missing" && exit 1)
          test -n "${{ secrets.DEPLOY_USER }}" || (echo "DEPLOY_USER is missing" && exit 1)
          test -n "${{ secrets.DEPLOY_SSH_KEY }}" || (echo "DEPLOY_SSH_KEY is missing" && exit 1)
          test -n "${{ secrets.OPENROUTER_API_KEY }}" || (echo "OPENROUTER_API_KEY is missing" && exit 1)
          test -n "${{ secrets.DEEPSEEK_API_KEY }}" || (echo "DEEPSEEK_API_KEY is missing" && exit 1)
          test -n "${{ secrets.OPENAI_API_KEY }}" || (echo "OPENAI_API_KEY is missing" && exit 1)
          test -n "${{ secrets.DEEPINFRA_API_KEY }}" || (echo "DEEPINFRA_API_KEY is missing" && exit 1)

      - name: Configure SSH
        shell: bash
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload compose files
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
        run: |
          tar -C deploy/control-plane -czf /tmp/airnote-control-plane-dev-deploy.tgz \
            docker-compose.yml docker-compose.dev.yml Caddyfile README.md .env.example
          {
            printf 'OPENROUTER_API_KEY=%s\n' "$OPENROUTER_API_KEY"
            printf 'DEEPSEEK_API_KEY=%s\n' "$DEEPSEEK_API_KEY"
            printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY"
            printf 'DEEPINFRA_API_KEY=%s\n' "$DEEPINFRA_API_KEY"
          } > /tmp/airnote-control-plane-dev-secrets.env
          chmod 600 /tmp/airnote-control-plane-dev-secrets.env
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mkdir -p '$DEPLOY_PATH'"
          scp /tmp/airnote-control-plane-dev-deploy.tgz \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:$DEPLOY_PATH/deploy.tgz"
          scp /tmp/airnote-control-plane-dev-secrets.env \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:$DEPLOY_PATH/deploy-secrets.env"

      - name: Pull image and restart dev stack
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "DEPLOY_PATH='$DEPLOY_PATH' IMAGE_TAG='$IMAGE_TAG' GHCR_USER='$GHCR_USER' GHCR_TOKEN='$GHCR_TOKEN' COMPOSE_PROJECT='$COMPOSE_PROJECT' CONTROL_PLANE_PORT='$CONTROL_PLANE_PORT' POSTGRES_DB='$POSTGRES_DB' POSTGRES_PORT='$POSTGRES_PORT' POSTGRES_VOLUME_NAME='$POSTGRES_VOLUME_NAME' DEV_DOMAIN='$DEV_DOMAIN' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          tar xzf deploy.tgz
          rm -f deploy.tgz

          if [ ! -f .env ]; then
            cp .env.example .env
            chmod 600 .env
            echo "Created $DEPLOY_PATH/.env. Seed dev secrets, then rerun deploy."
            exit 2
          fi

          python3 - <<'PY'
          import os
          from pathlib import Path

          env_path = Path(".env")
          secret_path = Path("deploy-secrets.env")
          updates = {
              "CONTROL_PLANE_IMAGE": os.environ["IMAGE_TAG"],
              "CONTROL_PLANE_BIND": "127.0.0.1",
              "CONTROL_PLANE_PORT": os.environ["CONTROL_PLANE_PORT"],
              "POSTGRES_DB": os.environ["POSTGRES_DB"],
              "POSTGRES_USER": "said",
              "POSTGRES_BIND": "127.0.0.1",
              "POSTGRES_PORT": os.environ["POSTGRES_PORT"],
              "POSTGRES_VOLUME_NAME": os.environ["POSTGRES_VOLUME_NAME"],
              "DOMAIN": os.environ["DEV_DOMAIN"],
          }

          if secret_path.exists():
              for line in secret_path.read_text().splitlines():
                  if not line.strip() or line.lstrip().startswith("#") or "=" not in line:
                      continue
                  key, value = line.split("=", 1)
                  updates[key] = value

          lines = env_path.read_text().splitlines()
          out = []
          seen = set()
          for line in lines:
              if "=" in line and not line.lstrip().startswith("#"):
                  key = line.split("=", 1)[0]
                  if key in updates:
                      out.append(f"{key}={updates[key]}")
                      seen.add(key)
                      continue
              out.append(line)

          for key, value in updates.items():
              if key not in seen:
                  out.append(f"{key}={value}")

          env_path.write_text("\n".join(out) + "\n")
          secret_path.unlink(missing_ok=True)
          PY

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          compose=(docker compose -p "$COMPOSE_PROJECT" -f docker-compose.yml -f docker-compose.dev.yml)
          "${compose[@]}" pull control-plane
          "${compose[@]}" up -d --force-recreate control-plane

          cid="$("${compose[@]}" ps -q control-plane)"
          docker inspect "$cid" --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep -q "^DATABASE_URL=.*${POSTGRES_DB}" \
            || (echo "DATABASE_URL does not point at $POSTGRES_DB" && exit 1)
          docker inspect "$cid" --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep -q "^OPENROUTER_API_KEY=." \
            || (echo "OPENROUTER_API_KEY was not propagated into the dev control-plane container" && exit 1)
          docker inspect "$cid" --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep -q "^DEEPSEEK_API_KEY=." \
            || (echo "DEEPSEEK_API_KEY was not propagated into the dev control-plane container" && exit 1)
          docker inspect "$cid" --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep -q "^OPENAI_API_KEY=." \
            || (echo "OPENAI_API_KEY was not propagated into the dev control-plane container" && exit 1)
          docker inspect "$cid" --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep -q "^DEEPINFRA_API_KEY=." \
            || (echo "DEEPINFRA_API_KEY was not propagated into the dev control-plane container" && exit 1)

          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${CONTROL_PLANE_PORT}/v1/health" >/dev/null; then
              break
            fi
            sleep 2
            test "$i" -lt 60
          done

          "${compose[@]}" ps
          docker image prune -f
          REMOTE

      - name: Verify dev health
        shell: bash
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "curl -fsS 'http://127.0.0.1:${CONTROL_PLANE_PORT}/v1/health'"
