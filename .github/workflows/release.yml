name: Release

# Triggered by pushing a v* tag, or manually from the Actions tab.
# Use scripts/bump-version.sh to bump first, merge that change to main, then
# either push `vX.Y.Z` or run this workflow manually with `tag = vX.Y.Z`.
#
# Channels (see CONTRIBUTING.md for the full rationale):
#   * `vX.Y.Z`               → stable; writes `latest.json` (the legacy
#                              endpoint baked into every shipped client).
#   * `vX.Y.Z-{beta,rc,alpha}N` → prerelease; writes `beta.json` and marks
#                              the GitHub release as prerelease.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, for example v2.1.8'
        required: true
        type: string
      platforms:
        description: 'Which platforms to build/publish'
        required: false
        default: both
        type: choice
        options: [both, darwin, windows]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  PRODUCT_NAME: AirNote

jobs:
  # Compute the build matrix from the `platforms` input. A tag push (no input)
  # defaults to `both`. Selecting a single platform lets you ship, e.g., a
  # Windows-only update without rebuilding/republishing macOS — combined with the
  # per-target manifests below, macOS clients then see no update.
  setup:
    name: Resolve build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          P="${{ github.event.inputs.platforms }}"
          [ -z "$P" ] && P="both"
          DARWIN='{"target":"aarch64-apple-darwin","arch_short":"aarch64","runs_on":"macos-26","platform":"darwin"}'
          WINDOWS='{"target":"x86_64-pc-windows-msvc","arch_short":"x86_64","runs_on":"windows-latest","platform":"windows"}'
          case "$P" in
            darwin)  INCLUDE="[$DARWIN]" ;;
            windows) INCLUDE="[$WINDOWS]" ;;
            *)       INCLUDE="[$DARWIN,$WINDOWS]" ;;
          esac
          echo "matrix={\"include\":$INCLUDE}" >> "$GITHUB_OUTPUT"
          echo "platforms=$P -> $INCLUDE"

  build:
    name: Build (${{ matrix.target }})
    needs: setup
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Read workspace version (bash)
        if: matrix.platform == 'darwin'
        id: ver_mac
        shell: bash
        run: |
          VERSION=$(awk '
            /^\[workspace\.package\]/ { in_section = 1; next }
            /^\[/                     { in_section = 0 }
            in_section && /^[[:space:]]*version[[:space:]]*=/ {
              gsub(/.*=[[:space:]]*"/, ""); gsub(/".*/, ""); print; exit
            }
          ' Cargo.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "workspace version: $VERSION"

      - name: Read workspace version (pwsh)
        if: matrix.platform == 'windows'
        id: ver_win
        shell: pwsh
        run: |
          $content = Get-Content Cargo.toml -Raw
          $match = [regex]::Match($content, '(?ms)^\[workspace\.package\].*?^version\s*=\s*"([^"]+)"')
          $version = $match.Groups[1].Value
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "workspace version: $version"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          cache-targets: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop deps (Mac)
        if: matrix.platform == 'darwin'
        working-directory: desktop
        run: npm ci

      - name: Install desktop deps (Windows)
        if: matrix.platform == 'windows'
        working-directory: desktop
        shell: pwsh
        run: |
          # `create-dmg` is macOS-only and pulls `appdmg` (`os: darwin`),
          # which makes `npm ci` fail on Windows. The Windows installer path
          # only needs Tauri/NSIS, so remove the Mac-only dev tool in the
          # ephemeral runner checkout and keep platform optional deps intact.
          npm pkg delete devDependencies.create-dmg
          npm install --package-lock-only --ignore-scripts
          npm ci

      # ── macOS: import signing certificate into CI keychain ────────────────
      - name: Import Apple codesign certificate
        if: matrix.platform == 'darwin'
        env:
          CERTIFICATE_BASE64: ${{ secrets.CODESIGN_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CODESIGN_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo -n "$CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s \
            "$KEYCHAIN_PATH" \
            /Library/Keychains/System.keychain \
            /System/Library/Keychains/SystemRootCertificates.keychain
          security find-identity -v -p codesigning
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      # ── macOS: AirNote.app + DMG + notarization ────────────────────────────
      - name: Build airnote-backend sidecar (Mac)
        if: matrix.platform == 'darwin'
        shell: bash
        timeout-minutes: 10
        run: |
          cargo build -p said-backend --release --target ${{ matrix.target }}
          mkdir -p desktop/src-tauri/binaries
          cp "target/${{ matrix.target }}/release/airnote-backend" \
            "desktop/src-tauri/binaries/airnote-backend-${{ matrix.target }}"
          chmod +x "desktop/src-tauri/binaries/airnote-backend-${{ matrix.target }}"

      - name: Build AirNote.app only (Mac)
        if: matrix.platform == 'darwin'
        shell: bash
        timeout-minutes: 20
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        working-directory: desktop
        run: |
          # Build only the .app bundle here. Signing, DMG creation, notarization,
          # stapling, and Gatekeeper verification are separate visible steps below.
          npm run tauri:build -- \
            --target ${{ matrix.target }} \
            --bundles app \
            --ci \
            --verbose \
            --no-sign

      - name: Sign and verify AirNote.app (Mac)
        if: matrix.platform == 'darwin'
        shell: bash
        timeout-minutes: 8
        env:
          APPLE_SIGNING_IDENTITY: "Developer ID Application: EMIAC TECHNOLOGIES LIMITED (96ZQGP7L3B)"
        run: |
          set -euo pipefail
          APP_PATH="target/${{ matrix.target }}/release/bundle/macos/${PRODUCT_NAME}.app"
          EMBEDDED_BACKEND="$APP_PATH/Contents/MacOS/airnote-backend"
          ENTITLEMENTS="desktop/src-tauri/AirNote.entitlements"
          BUNDLE_ID="com.emiac.airnote.desktop"

          test -d "$APP_PATH"
          test -x "$EMBEDDED_BACKEND"

          rm -f "$APP_PATH/Contents/MacOS/.env"
          xattr -cr "$APP_PATH" 2>/dev/null || true

          codesign --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" \
            --entitlements "$ENTITLEMENTS" \
            "$EMBEDDED_BACKEND"

          codesign --force --deep --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" \
            --entitlements "$ENTITLEMENTS" \
            "$APP_PATH"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --verify --strict --verbose=2 "$EMBEDDED_BACKEND"

          ACTUAL_ID=$(codesign -dv "$APP_PATH" 2>&1 | awk -F= '/^Identifier=/ {print $2}')
          test "$ACTUAL_ID" = "$BUNDLE_ID"
          echo "Signed app verified: $APP_PATH"

      - name: Create and verify DMG (Mac)
        if: matrix.platform == 'darwin'
        shell: bash
        timeout-minutes: 8
        env:
          APPLE_SIGNING_IDENTITY: "Developer ID Application: EMIAC TECHNOLOGIES LIMITED (96ZQGP7L3B)"
        run: |
          set -euo pipefail
          APP_PATH="target/${{ matrix.target }}/release/bundle/macos/${PRODUCT_NAME}.app"
          BUNDLE_DIR="target/${{ matrix.target }}/release/bundle"
          STAGING="$BUNDLE_DIR/dmg-staging"
          DMG_OUT="$BUNDLE_DIR/dmg/${PRODUCT_NAME}_${{ steps.ver_mac.outputs.version }}_${{ matrix.arch_short }}.dmg"

          rm -rf "$STAGING" "$DMG_OUT"
          mkdir -p "$STAGING" "$BUNDLE_DIR/dmg"
          ditto "$APP_PATH" "$STAGING/${PRODUCT_NAME}.app"
          ln -s /Applications "$STAGING/Applications"

          hdiutil create \
            -volname "$PRODUCT_NAME" \
            -srcfolder "$STAGING" \
            -ov \
            -format UDZO \
            "$DMG_OUT"

          rm -rf "$STAGING"
          test -f "$DMG_OUT"

          # Gatekeeper assesses the downloaded DMG before the .app inside it.
          # Sign the disk image container as well as the app bundle; otherwise
          # notarization can be accepted but spctl reports "no usable signature".
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$DMG_OUT"
          codesign -dv --verbose=2 "$DMG_OUT"

          ATTACH_OUT=$(hdiutil attach -nobrowse -readonly "$DMG_OUT")
          echo "$ATTACH_OUT"
          DMG_DEV=$(echo "$ATTACH_OUT" | awk '/\/dev\/disk[0-9]+s[0-9]+/ && /\/Volumes\// {print $1; exit}')
          DMG_VOL=$(echo "$ATTACH_OUT" | awk '/\/Volumes\// {for (i=3;i<=NF;i++) printf "%s%s", $i, (i<NF?" ":""); print ""; exit}')
          codesign --verify --deep --strict --verbose=2 "$DMG_VOL/${PRODUCT_NAME}.app"
          hdiutil detach "$DMG_DEV" -force >/dev/null
          echo "DMG verified: $DMG_OUT"

      - name: Notarize, staple, and verify DMG (Mac)
        if: matrix.platform == 'darwin'
        shell: bash
        timeout-minutes: 30
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: 96ZQGP7L3B
        run: |
          set -euo pipefail
          : "${APPLE_ID:?APPLE_ID secret is required for release notarization}"
          : "${APPLE_APP_SPECIFIC_PASSWORD:?APPLE_APP_SPECIFIC_PASSWORD secret is required for release notarization}"

          DMG_OUT="target/${{ matrix.target }}/release/bundle/dmg/${PRODUCT_NAME}_${{ steps.ver_mac.outputs.version }}_${{ matrix.arch_short }}.dmg"
          test -f "$DMG_OUT"

          # Apple DTS recommends increasing the notary upload connection timeout
          # for slow or flaky S3-backed uploads. This keeps CI bounded while
          # avoiding the default 100s upload deadline.
          defaults write com.apple.gke.notary.tool nt-upload-connection-timeout 300 || true

          xcrun notarytool submit "$DMG_OUT" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --timeout 25m \
            --wait \
            --verbose

          xcrun stapler staple "$DMG_OUT"
          spctl --assess --type open --context context:primary-signature -v "$DMG_OUT"
          echo "DMG is signed, notarized, stapled, and Gatekeeper-verified: $DMG_OUT"

      # ── Windows: sidecars + Tauri NSIS installer ───────────────────────────
      - name: Build AirNote.exe + NSIS installer (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pwsh scripts/build-windows.ps1 -RequireInstaller -RequireWhisper

      # ── Stage artifacts ────────────────────────────────────────────────────
      - name: Stage release artifacts (Mac)
        if: matrix.platform == 'darwin'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          mkdir -p release-artifacts
          # DMG for manual download
          cp "target/${{ matrix.target }}/release/bundle/dmg/${PRODUCT_NAME}_${{ steps.ver_mac.outputs.version }}_${{ matrix.arch_short }}.dmg" release-artifacts/

          # Signed .tar.gz for Tauri auto-updater
          UPDATE_TAR="${PRODUCT_NAME}_${{ steps.ver_mac.outputs.version }}_${{ matrix.arch_short }}.app.tar.gz"
          cd "target/${{ matrix.target }}/release/bundle/macos"
          tar czf "$UPDATE_TAR" "${PRODUCT_NAME}.app"
          mv "$UPDATE_TAR" "$GITHUB_WORKSPACE/release-artifacts/"
          cd "$GITHUB_WORKSPACE"

          # Sign the update bundle with the Tauri updater key
          cd desktop
          npx tauri signer sign \
            "$GITHUB_WORKSPACE/release-artifacts/$UPDATE_TAR" \
            --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          cd "$GITHUB_WORKSPACE"
          echo "Signature file:"
          ls -la "$GITHUB_WORKSPACE/release-artifacts/"*.sig || true

      - name: Stage release artifacts (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = "${{ steps.ver_win.outputs.version }}"
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null

          # Tauri v2 NSIS produces (with createUpdaterArtifacts):
          #   - AirNote_<ver>_x64-setup.exe      (installer = manual download AND updater artifact)
          #   - AirNote_<ver>_x64-setup.exe.sig  (updater signature, when signing key is set)
          $nsis = "target/${{ matrix.target }}/release/bundle/nsis"
          Get-ChildItem $nsis -Filter "${env:PRODUCT_NAME}_*-setup.exe"     | ForEach-Object { Copy-Item $_.FullName release-artifacts/ }
          Get-ChildItem $nsis -Filter "${env:PRODUCT_NAME}_*-setup.exe.sig" | ForEach-Object { Copy-Item $_.FullName release-artifacts/ }

          Write-Host "── staged windows artifacts ──"
          Get-ChildItem release-artifacts | Format-List Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: release-artifacts/
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read workspace version
        id: ver
        run: |
          VERSION=$(awk '
            /^\[workspace\.package\]/ { in_section = 1; next }
            /^\[/                     { in_section = 0 }
            in_section && /^[[:space:]]*version[[:space:]]*=/ {
              gsub(/.*=[[:space:]]*"/, ""); gsub(/".*/, ""); print; exit
            }
          ' Cargo.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve release tag
        id: rel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi

          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release tag: $TAG" >&2
            exit 1
          fi

          EXPECTED="v${{ steps.ver.outputs.version }}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "tag $TAG does not match workspace version $EXPECTED" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release tag: $TAG"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten and checksum
        working-directory: artifacts
        run: |
          find . -mindepth 2 -type f -exec mv -f {} . \;
          find . -mindepth 1 -type d -empty -delete
          sha256sum * | sort -k 2 > SHA256SUMS
          echo "── released files ──"
          ls -lh
          echo "── checksums ──"
          cat SHA256SUMS

      - name: Detect release channel
        id: chan
        run: |
          TAG="${{ steps.rel.outputs.tag }}"
          case "$TAG" in
            *-beta*|*-rc*|*-alpha*) CHANNEL="beta" ;;
            *)                       CHANNEL="stable" ;;
          esac
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "release channel: $CHANNEL"

      - name: Generate updater manifests (per-target + combined)
        working-directory: artifacts
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.rel.outputs.tag }}"
          CHANNEL="${{ steps.chan.outputs.channel }}"
          PRODUCT_NAME="${PRODUCT_NAME:-AirNote}"
          NOTES="See https://github.com/EMIAC-org/Said/releases/tag/${TAG}"
          BASE_URL="https://github.com/EMIAC-org/Said/releases/download/${TAG}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # stable -> latest.json / darwin-latest.json / windows-latest.json
          # beta   -> beta.json   / darwin-beta.json   / windows-beta.json
          SUFFIX="latest"; [ "$CHANNEL" = "stable" ] || SUFFIX="beta"

          read_sig() { [ -f "$1" ] && cat "$1" || echo ""; }

          DARWIN_FILE="${PRODUCT_NAME}_${VERSION}_aarch64.app.tar.gz"
          # Tauri v2 NSIS updater artifact is the signed -setup.exe (+ .exe.sig).
          WINDOWS_FILE="${PRODUCT_NAME}_${VERSION}_x64-setup.exe"

          darwin_entry() {
            cat <<EOF
              "darwin-aarch64": {
                "signature": "$(read_sig "${DARWIN_FILE}.sig")",
                "url": "${BASE_URL}/${DARWIN_FILE}"
              }
          EOF
          }
          windows_entry() {
            cat <<EOF
              "windows-x86_64": {
                "signature": "$(read_sig "${WINDOWS_FILE}.sig")",
                "url": "${BASE_URL}/${WINDOWS_FILE}"
              }
          EOF
          }

          # $1 = output file, $2 = platforms block (already-joined entries)
          write_manifest() {
            cat > "$1" <<EOF
          {
            "version": "${VERSION}",
            "notes": "${NOTES}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
          $2
            }
          }
          EOF
          }

          # Per-target manifests — only for platforms actually built this run.
          if [ -f "$DARWIN_FILE" ]; then
            write_manifest "darwin-${SUFFIX}.json" "$(darwin_entry)"
          fi
          if [ -f "$WINDOWS_FILE" ]; then
            write_manifest "windows-${SUFFIX}.json" "$(windows_entry)"
          fi

          # Combined (legacy) manifest for clients on the old single-endpoint
          # build. Only written on a FULL both-platform release, so a
          # single-platform release never rewrites it (which would otherwise show
          # legacy clients a version with their platform missing → check errors).
          if [ -f "$DARWIN_FILE" ] && [ -f "$WINDOWS_FILE" ]; then
            write_manifest "${SUFFIX}.json" "$(darwin_entry),
          $(windows_entry)"
          fi

          echo "── manifests written ──"
          ls -la *.json
          for f in *.json; do echo "── $f ──"; cat "$f"; done

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: false
          prerelease: ${{ steps.chan.outputs.channel == 'beta' }}
