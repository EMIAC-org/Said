name: Release

# Triggered by pushing a v* tag, or manually from the Actions tab.
# Use scripts/bump-version.sh to bump first, merge that change to main, then
# either push `vX.Y.Z` or run this workflow manually with `tag = vX.Y.Z`.
#
# Channels (see CONTRIBUTING.md for the full rationale):
#   * `vX.Y.Z`               → stable; writes `latest.json` (the legacy
#                              endpoint baked into every shipped client).
#   * `vX.Y.Z-{beta,rc,alpha}N` → prerelease; writes `beta.json` and marks
#                              the GitHub release as prerelease.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, for example v2.1.8'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch_short: aarch64
            runs_on: macos-latest
            platform: darwin
          - target: x86_64-pc-windows-msvc
            arch_short: x86_64
            runs_on: windows-latest
            platform: windows

    steps:
      - uses: actions/checkout@v4

      - name: Read workspace version (bash)
        if: matrix.platform == 'darwin'
        id: ver_mac
        shell: bash
        run: |
          VERSION=$(awk '
            /^\[workspace\.package\]/ { in_section = 1; next }
            /^\[/                     { in_section = 0 }
            in_section && /^[[:space:]]*version[[:space:]]*=/ {
              gsub(/.*=[[:space:]]*"/, ""); gsub(/".*/, ""); print; exit
            }
          ' Cargo.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "workspace version: $VERSION"

      - name: Read workspace version (pwsh)
        if: matrix.platform == 'windows'
        id: ver_win
        shell: pwsh
        run: |
          $content = Get-Content Cargo.toml -Raw
          $match = [regex]::Match($content, '(?ms)^\[workspace\.package\].*?^version\s*=\s*"([^"]+)"')
          $version = $match.Groups[1].Value
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "workspace version: $version"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          cache-targets: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      # ── macOS: import signing certificate into CI keychain ────────────────
      - name: Import Apple codesign certificate
        if: matrix.platform == 'darwin'
        env:
          CERTIFICATE_BASE64: ${{ secrets.CODESIGN_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CODESIGN_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo -n "$CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

      # ── macOS: CLI binary + Said.app + DMG via build-dmg.sh ────────────────
      - name: Build CLI binary (Mac)
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          cargo build -p said --release --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/said said-${{ matrix.target }}
          chmod +x said-${{ matrix.target }}

      - name: Build Said.app + DMG (Mac)
        if: matrix.platform == 'darwin'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/build-dmg.sh ${{ matrix.target }}

      # ── Windows: said-backend sidecar + Tauri NSIS installer ───────────────
      #    The CLI binary (`said`) is skipped on Windows for v3.0 — only the
      #    desktop app ships. Bring the CLI up in a follow-up if power users
      #    request it.
      - name: Build said-backend sidecar (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cargo build -p said-backend --release --target ${{ matrix.target }}
          New-Item -ItemType Directory -Force -Path desktop/src-tauri/binaries | Out-Null
          Copy-Item `
            "target/${{ matrix.target }}/release/said-backend.exe" `
            "desktop/src-tauri/binaries/said-backend-${{ matrix.target }}.exe"

      - name: Build Said.exe + NSIS installer (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        working-directory: desktop
        run: npm run tauri:build -- --target ${{ matrix.target }}

      # ── Stage artifacts ────────────────────────────────────────────────────
      - name: Stage release artifacts (Mac)
        if: matrix.platform == 'darwin'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          mkdir -p release-artifacts
          cp said-${{ matrix.target }} release-artifacts/

          # DMG for manual download
          cp "target/${{ matrix.target }}/release/bundle/dmg/Said_${{ steps.ver_mac.outputs.version }}_${{ matrix.arch_short }}.dmg" release-artifacts/

          # Signed .tar.gz for Tauri auto-updater
          UPDATE_TAR="Said_${{ steps.ver_mac.outputs.version }}_${{ matrix.arch_short }}.app.tar.gz"
          cd "target/${{ matrix.target }}/release/bundle/macos"
          tar czf "$UPDATE_TAR" Said.app
          mv "$UPDATE_TAR" "$GITHUB_WORKSPACE/release-artifacts/"
          cd "$GITHUB_WORKSPACE"

          # Sign the update bundle with the Tauri updater key
          cd desktop
          npx tauri signer sign \
            "$GITHUB_WORKSPACE/release-artifacts/$UPDATE_TAR" \
            --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          cd "$GITHUB_WORKSPACE"
          echo "Signature file:"
          ls -la "$GITHUB_WORKSPACE/release-artifacts/"*.sig || true

      - name: Stage release artifacts (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = "${{ steps.ver_win.outputs.version }}"
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null

          # Tauri NSIS produces:
          #   - Said_<ver>_x64-setup.exe         (installer for manual download)
          #   - Said_<ver>_x64-setup.nsis.zip    (auto-updater bundle)
          #   - Said_<ver>_x64-setup.nsis.zip.sig (updater signature, only if signing key was set)
          $nsis = "target/${{ matrix.target }}/release/bundle/nsis"
          Get-ChildItem $nsis -Filter "Said_*-setup.exe"             | ForEach-Object { Copy-Item $_.FullName release-artifacts/ }
          Get-ChildItem $nsis -Filter "Said_*-setup.nsis.zip"        | ForEach-Object { Copy-Item $_.FullName release-artifacts/ }
          Get-ChildItem $nsis -Filter "Said_*-setup.nsis.zip.sig"    | ForEach-Object { Copy-Item $_.FullName release-artifacts/ }

          Write-Host "── staged windows artifacts ──"
          Get-ChildItem release-artifacts | Format-List Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: release-artifacts/
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read workspace version
        id: ver
        run: |
          VERSION=$(awk '
            /^\[workspace\.package\]/ { in_section = 1; next }
            /^\[/                     { in_section = 0 }
            in_section && /^[[:space:]]*version[[:space:]]*=/ {
              gsub(/.*=[[:space:]]*"/, ""); gsub(/".*/, ""); print; exit
            }
          ' Cargo.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve release tag
        id: rel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi

          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release tag: $TAG" >&2
            exit 1
          fi

          EXPECTED="v${{ steps.ver.outputs.version }}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "tag $TAG does not match workspace version $EXPECTED" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release tag: $TAG"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten and checksum
        working-directory: artifacts
        run: |
          find . -mindepth 2 -type f -exec mv -f {} . \;
          find . -mindepth 1 -type d -empty -delete
          sha256sum * | sort -k 2 > SHA256SUMS
          echo "── released files ──"
          ls -lh
          echo "── checksums ──"
          cat SHA256SUMS

      - name: Detect release channel
        id: chan
        run: |
          TAG="${{ steps.rel.outputs.tag }}"
          case "$TAG" in
            *-beta*|*-rc*|*-alpha*) CHANNEL="beta" ;;
            *)                       CHANNEL="stable" ;;
          esac
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "release channel: $CHANNEL"

      - name: Generate updater manifests (latest.json + channel manifests)
        working-directory: artifacts
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.rel.outputs.tag }}"
          CHANNEL="${{ steps.chan.outputs.channel }}"
          NOTES="See https://github.com/EMIAC-org/Said/releases/tag/${TAG}"
          BASE_URL="https://github.com/EMIAC-org/Said/releases/download/${TAG}"

          read_sig() {
            local file="$1"
            [ -f "$file" ] && cat "$file" || echo ""
          }

          AARCH64_SIG=$(read_sig "Said_${VERSION}_aarch64.app.tar.gz.sig")
          WINDOWS_SIG=$(read_sig "Said_${VERSION}_x64-setup.nsis.zip.sig")
          WINDOWS_FILE="Said_${VERSION}_x64-setup.nsis.zip"

          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          write_manifest() {
            local FILE="$1"
            cat > "$FILE" <<EOF
          {
            "version": "${VERSION}",
            "notes": "${NOTES}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${AARCH64_SIG}",
                "url": "${BASE_URL}/Said_${VERSION}_aarch64.app.tar.gz"
              },
              "windows-x86_64": {
                "signature": "${WINDOWS_SIG}",
                "url": "${BASE_URL}/${WINDOWS_FILE}"
              }
            }
          }
          EOF
          }

          if [ "$CHANNEL" = "stable" ]; then
            write_manifest latest.json
          else
            write_manifest beta.json
          fi

          echo "── manifests written ──"
          ls -la *.json
          for f in *.json; do
            echo "── $f ──"
            cat "$f"
          done

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: false
          prerelease: ${{ steps.chan.outputs.channel == 'beta' }}
