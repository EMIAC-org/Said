name: Release

# Triggered by pushing a v* tag. Use scripts/bump-version.sh to bump first,
# then `git tag vX.Y.Z && git push --tags` to fire this workflow.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch_short: aarch64
          - target: x86_64-apple-darwin
            arch_short: x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Read workspace version
        id: ver
        run: |
          VERSION=$(awk '
            /^\[workspace\.package\]/ { in_section = 1; next }
            /^\[/                     { in_section = 0 }
            in_section && /^[[:space:]]*version[[:space:]]*=/ {
              gsub(/.*=[[:space:]]*"/, ""); gsub(/".*/, ""); print; exit
            }
          ' Cargo.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "workspace version: $VERSION"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Build CLI binary (said)
        run: |
          cargo build -p said --release --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/said said-${{ matrix.target }}
          chmod +x said-${{ matrix.target }}

      - name: Build Said.app + DMG
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/build-dmg.sh ${{ matrix.target }}

      - name: Stage release artifacts
        run: |
          mkdir -p release-artifacts
          cp said-${{ matrix.target }} release-artifacts/

          # DMG for manual download
          cp "target/${{ matrix.target }}/release/bundle/dmg/Said_${{ steps.ver.outputs.version }}_${{ matrix.arch_short }}.dmg" release-artifacts/

          # Signed .tar.gz for Tauri auto-updater
          APP_PATH="target/${{ matrix.target }}/release/bundle/macos/Said.app"
          UPDATE_TAR="Said_${{ steps.ver.outputs.version }}_${{ matrix.arch_short }}.app.tar.gz"
          cd "target/${{ matrix.target }}/release/bundle/macos"
          tar czf "$UPDATE_TAR" Said.app
          mv "$UPDATE_TAR" "$GITHUB_WORKSPACE/release-artifacts/"
          cd "$GITHUB_WORKSPACE"

          # The .sig file is generated by Tauri build when TAURI_SIGNING_PRIVATE_KEY is set
          SIG_FILE="target/${{ matrix.target }}/release/bundle/macos/Said.app.tar.gz.sig"
          if [ -f "$SIG_FILE" ]; then
            cp "$SIG_FILE" "release-artifacts/${UPDATE_TAR}.sig"
          else
            # Sign manually if Tauri didn't generate it
            if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
              cd desktop
              npx tauri signer sign "$GITHUB_WORKSPACE/release-artifacts/$UPDATE_TAR" --private-key-path <(echo "$TAURI_SIGNING_PRIVATE_KEY") 2>/dev/null || true
              cd "$GITHUB_WORKSPACE"
            fi
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: release-artifacts/
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read workspace version
        id: ver
        run: |
          VERSION=$(awk '
            /^\[workspace\.package\]/ { in_section = 1; next }
            /^\[/                     { in_section = 0 }
            in_section && /^[[:space:]]*version[[:space:]]*=/ {
              gsub(/.*=[[:space:]]*"/, ""); gsub(/".*/, ""); print; exit
            }
          ' Cargo.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten and checksum
        working-directory: artifacts
        run: |
          find . -mindepth 2 -type f -exec mv -f {} . \;
          find . -mindepth 1 -type d -empty -delete
          sha256sum * | sort -k 2 > SHA256SUMS
          echo "── released files ──"
          ls -lh
          echo "── checksums ──"
          cat SHA256SUMS

      - name: Generate latest.json for Tauri updater
        working-directory: artifacts
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="${{ github.ref_name }}"
          NOTES="See https://github.com/EMIAC-org/Said/releases/tag/${TAG}"
          BASE_URL="https://github.com/EMIAC-org/Said/releases/download/${TAG}"

          # Read signatures
          AARCH64_SIG=""
          X86_64_SIG=""
          if [ -f "Said_${VERSION}_aarch64.app.tar.gz.sig" ]; then
            AARCH64_SIG=$(cat "Said_${VERSION}_aarch64.app.tar.gz.sig")
          fi
          if [ -f "Said_${VERSION}_x86_64.app.tar.gz.sig" ]; then
            X86_64_SIG=$(cat "Said_${VERSION}_x86_64.app.tar.gz.sig")
          fi

          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "${NOTES}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${AARCH64_SIG}",
                "url": "${BASE_URL}/Said_${VERSION}_aarch64.app.tar.gz"
              },
              "darwin-x86_64": {
                "signature": "${X86_64_SIG}",
                "url": "${BASE_URL}/Said_${VERSION}_x86_64.app.tar.gz"
              }
            }
          }
          EOF

          echo "── latest.json ──"
          cat latest.json

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: false
