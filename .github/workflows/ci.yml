name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Cancel superseded runs on the same ref. Saves macOS minutes on rapid pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace (fmt, clippy, test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false

      - name: cargo fmt --check
        run: cargo fmt --all --check

      # No -D warnings: correctness lints are deny-by-default and gate the
      # build; style / complexity / perf lints surface as advisory warnings
      # without blocking CI. Promote individual lints to deny in
      # [workspace.lints] (Cargo.toml) once the codebase pays down debt.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace --all-targets

  rust-windows:
    name: Rust workspace (Windows tripwire — cargo check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ci-windows
          cache-bin: false

      # Tauri's build script verifies the externalBin sidecar exists for the
      # target triple. `cargo check` doesn't build it (and the real .exe is only
      # produced in the release workflow), so drop a placeholder to satisfy the
      # existence check. The sidecar's *code* is still type-checked as part of
      # the workspace check below — we only need the file path to exist here.
      - name: Stub said-backend sidecar for tauri externalBin check
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/src-tauri/binaries | Out-Null
          New-Item -ItemType File -Force -Path desktop/src-tauri/binaries/said-backend-x86_64-pc-windows-msvc.exe | Out-Null

      # Full Windows compile gate: check the whole workspace including the Tauri
      # desktop shell (`said-desktop`) so a push to main reports real Windows
      # build errors for the actual app. Only the standalone `said` CLI stays
      # excluded — it's macOS-only for now (also skipped in release.yml).
      - name: cargo check (full Windows app; CLI is macOS-only)
        run: cargo check --workspace --exclude said

      - name: cargo test pure-logic crates (runs on every host)
        # `--lib` is a global cargo-test flag — appears once even when
        # multiple `-p` packages are listed. Earlier `--lib -p X --lib`
        # form is rejected by cargo 1.78+ with "cannot be used multiple times".
        run: cargo test -p said-hotkey -p said-paster --lib

  control-plane:
    name: control-plane (excluded crate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/control-plane
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/control-plane

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: crates/control-plane/admin-ui/pnpm-lock.yaml

      - name: admin-ui install
        run: pnpm install --frozen-lockfile
        working-directory: crates/control-plane/admin-ui

      - name: admin-ui typecheck
        run: pnpm run typecheck
        working-directory: crates/control-plane/admin-ui

      - name: admin-ui build
        run: pnpm run build
        working-directory: crates/control-plane/admin-ui

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets

      - name: cargo build
        run: cargo build

  desktop:
    name: Desktop (typecheck + vite build)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: npm ci
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: vite build
        run: npm run build

  landing:
    name: Landing (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: npm ci
        run: npm ci

      - name: typecheck
        run: npm run typecheck
