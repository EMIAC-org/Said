name: CI

on:
  push:
    branches: [main, windows-port, 'release/**']
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Cancel superseded runs on the same ref. Saves macOS minutes on rapid pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-macos:
    name: Rust workspace (Mac)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      # No -D warnings: correctness lints are deny-by-default and gate the
      # build; style / complexity / perf lints surface as advisory warnings
      # without blocking CI. Promote individual lints to deny in
      # [workspace.lints] (Cargo.toml) once the codebase pays down debt.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace --all-targets

  # Windows port verification.
  #
  # Until P3 lands (full paster + hotkey Windows impl), only the refactored
  # platform crates are expected to compile here. The job is marked
  # `continue-on-error: true` per the Branching & Release Strategy ref doc
  # (Mac required green; Windows informational during P0-P2).
  #
  # Promote `continue-on-error` to false once paster + hotkey Windows impl
  # is done (end of P3) — at that point the whole workspace will compile
  # natively on `windows-latest` and Windows joins Mac as a required gate.
  rust-windows:
    name: Rust (Windows port — informational until P3)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      # After P1: every workspace member compiles on Windows.
      # said-desktop pulls in a Tauri sidecar via tauri.conf.json
      # `externalBin: ["binaries/said-backend"]` — Tauri's build script
      # looks for `binaries/said-backend-<target-triple>.exe` and fails
      # the build if it's missing. So we build the sidecar first and
      # copy it into the expected path before building said-desktop.
      - name: Build said-backend sidecar
        run: cargo build -p said-backend --release

      - name: Stage sidecar binary for Tauri externalBin lookup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/src-tauri/binaries | Out-Null
          Copy-Item -Force target/release/said-backend.exe desktop/src-tauri/binaries/said-backend-x86_64-pc-windows-msvc.exe

      - name: npm ci + build frontend dist
        working-directory: desktop
        run: |
          npm ci
          npm run build

      # --lib --bins --tests (not --all-targets) skips examples; the
      # `said-paster` test_ax_methods example is macOS-only by design
      # (links Apple ApplicationServices framework directly).
      - name: cargo build (workspace)
        run: cargo build --workspace --lib --bins --tests

      - name: cargo clippy (workspace)
        run: cargo clippy --workspace --lib --bins --tests

      - name: cargo test (workspace)
        run: cargo test --workspace --lib --bins --tests

  control-plane:
    name: control-plane (excluded crate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/control-plane
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/control-plane

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets

      - name: cargo build
        run: cargo build

  desktop:
    name: Desktop (typecheck + vite build)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: npm ci
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: vite build
        run: npm run build

  landing:
    name: Landing (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: npm ci
        run: npm ci

      - name: typecheck
        run: npm run typecheck
