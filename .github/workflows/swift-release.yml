name: Swift Frontend Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v, for example 3.0.0"
        required: true
      release_notes:
        description: "Release notes shown in GitHub and Sparkle"
        required: false
        default: "Swift frontend release."

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    name: Build DMG, publish release, update appcast
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Sparkle configuration
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          CODESIGN_CERT_BASE64: ${{ secrets.CODESIGN_CERTIFICATE_BASE64 }}
          CODESIGN_CERT_PASSWORD: ${{ secrets.CODESIGN_CERTIFICATE_PASSWORD }}
        run: |
          test -n "${{ vars.SPARKLE_PUBLIC_ED_KEY }}" || {
            echo "::error::Set repository variable SPARKLE_PUBLIC_ED_KEY"
            exit 1
          }
          test -n "$SPARKLE_PRIVATE_KEY" || {
            echo "::error::Set repository secret SPARKLE_PRIVATE_KEY"
            exit 1
          }
          test -n "$CODESIGN_CERT_BASE64" || {
            echo "::error::Set repository secret CODESIGN_CERTIFICATE_BASE64"
            exit 1
          }
          test -n "$CODESIGN_CERT_PASSWORD" || {
            echo "::error::Set repository secret CODESIGN_CERTIFICATE_PASSWORD"
            exit 1
          }

      - name: Import code-signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.CODESIGN_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CODESIGN_CERTIFICATE_PASSWORD }}
          IDENTITY_MATCH: ${{ vars.CODESIGN_IDENTITY_MATCH }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="$(uuidgen)"
          KEYCHAIN_PATH="$RUNNER_TEMP/said-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/said-codesign-certificate.p12"

          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          if [ -n "$IDENTITY_MATCH" ]; then
            CODESIGN_IDENTITY="$(
              security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
                | awk -F '"' -v match="$IDENTITY_MATCH" '$2 ~ match { print $2; exit }'
            )"
          else
            CODESIGN_IDENTITY="$(
              security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
                | awk -F '"' '/"/ { print $2; exit }'
            )"
          fi
          if [ -z "$CODESIGN_IDENTITY" ]; then
            echo "::error::No usable code-signing identity found in CODESIGN_CERTIFICATE_BASE64"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$CODESIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: swift-release-${{ runner.os }}

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            swift-frontend/.build
            swift-frontend/.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('swift-frontend/Package.swift', 'swift-frontend/Package.resolved') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-

      - name: Resolve Swift packages
        working-directory: swift-frontend
        run: swift package resolve

      - name: Install Sparkle generate_appcast
        run: |
          set -euo pipefail
          GENERATE_APPCAST="$(find swift-frontend/.build/artifacts -path '*/Sparkle/bin/generate_appcast' -type f -print -quit)"
          if [ -z "$GENERATE_APPCAST" ]; then
            echo "::error::Sparkle generate_appcast not found after swift package resolve"
            find swift-frontend/.build/artifacts -name generate_appcast -type f -print || true
            exit 1
          fi
          install -m 0755 "$GENERATE_APPCAST" "$RUNNER_TEMP/generate_appcast"

      - name: Generate timestamp build number
        run: echo "SAID_BUILD_NUMBER=$(TZ=Asia/Kolkata date +%Y%m%d%H%M)" >> "$GITHUB_ENV"

      - name: Build Swift DMG
        env:
          SAID_VERSION: ${{ inputs.version }}
          SAID_BUILD_NUMBER: ${{ env.SAID_BUILD_NUMBER }}
          CODESIGN_IDENTITY: ${{ env.CODESIGN_IDENTITY }}
          CODESIGN_REQUIRE_STABLE: "1"
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_FEED_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/appcast.xml
        run: ./scripts/build-swift-dmg.sh

      - name: Prepare appcast input
        id: artifacts
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          DMG_PATH="$(ls target/swift-frontend/release/bundle/dmg/Said_${VERSION}_*.dmg | head -n 1)"
          DMG_NAME="$(basename "$DMG_PATH")"
          HTML_NAME="${DMG_NAME%.dmg}.html"
          mkdir -p Release
          cp "$DMG_PATH" "Release/$DMG_NAME"
          {
            echo "<h2>Said v${VERSION}</h2>"
            echo "<p>${RELEASE_NOTES}</p>"
          } > "Release/$HTML_NAME"
          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"

      - name: Generate signed Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_GENERATE_APPCAST: ${{ runner.temp }}/generate_appcast
          DOWNLOAD_URL_PREFIX: https://github.com/${{ github.repository }}/releases/download/v${{ inputs.version }}/
          RELEASE_LINK: https://github.com/${{ github.repository }}/releases
        run: ./scripts/generate-swift-appcast.sh Release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" Release/*.dmg --clobber
          else
            gh release create "v${VERSION}" Release/*.dmg \
              --title "Said v${VERSION}" \
              --notes "$RELEASE_NOTES" \
              --target "$GITHUB_SHA"
          fi

      - name: Commit appcast
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updater/appcast.xml
          git commit -m "Update Swift appcast for v${VERSION}" || true
          git push

      - name: Deploy appcast to GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload updater pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: updater/

      - name: Deploy updater pages
        uses: actions/deploy-pages@v4
