name: Release to VM

# Manual, VM-hosted release for both macOS and Windows. Builds the same signed
# artifacts as the GitHub `Release` workflow, then publishes them to the
# self-hosted update server (the updater's primary endpoint; GitHub Releases is
# the fallback). Composes a single `latest.json` containing both platforms so
# macOS and Windows clients update from the VM identically.

on:
  workflow_dispatch:
    inputs:
      keep_releases:
        description: "Number of VM-hosted versions to keep"
        required: false
        default: "3"
        type: string
      platforms:
        description: "Which platforms to build/publish"
        required: false
        default: both
        type: choice
        options: [both, darwin, windows]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PRODUCT_NAME: AirNote
  PUBLIC_BASE_URL: https://airnote.emiactech.com
  REMOTE_RELEASE_ROOT: /opt/airnote-control-plane/releases

jobs:
  # Resolve the matrix from the `platforms` input so a Windows-only (or
  # darwin-only) VM release rebuilds + republishes just that platform's
  # per-target manifest, leaving the other platform's manifest untouched.
  setup:
    name: Resolve build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          P="${{ github.event.inputs.platforms }}"
          [ -z "$P" ] && P="both"
          DARWIN='{"target":"aarch64-apple-darwin","arch_short":"aarch64","runs_on":"macos-26","platform":"darwin"}'
          WINDOWS='{"target":"x86_64-pc-windows-msvc","arch_short":"x86_64","runs_on":"windows-latest","platform":"windows"}'
          case "$P" in
            darwin)  INCLUDE="[$DARWIN]" ;;
            windows) INCLUDE="[$WINDOWS]" ;;
            *)       INCLUDE="[$DARWIN,$WINDOWS]" ;;
          esac
          echo "matrix={\"include\":$INCLUDE}" >> "$GITHUB_OUTPUT"
          echo "platforms=$P -> $INCLUDE"

  build:
    name: Build (${{ matrix.target }})
    needs: setup
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Read workspace version (bash)
        if: matrix.platform == 'darwin'
        id: ver_mac
        shell: bash
        run: |
          VERSION=$(awk '
            /^\[workspace\.package\]/ { in_section = 1; next }
            /^\[/                     { in_section = 0 }
            in_section && /^[[:space:]]*version[[:space:]]*=/ {
              gsub(/.*=[[:space:]]*"/, ""); gsub(/".*/, ""); print; exit
            }
          ' Cargo.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "workspace version: $VERSION"

      - name: Read workspace version (pwsh)
        if: matrix.platform == 'windows'
        id: ver_win
        shell: pwsh
        run: |
          $content = Get-Content Cargo.toml -Raw
          $match = [regex]::Match($content, '(?ms)^\[workspace\.package\].*?^version\s*=\s*"([^"]+)"')
          $version = $match.Groups[1].Value
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "workspace version: $version"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-vm-${{ matrix.target }}
          cache-targets: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop deps (Mac)
        if: matrix.platform == 'darwin'
        working-directory: desktop
        run: npm ci

      - name: Install desktop deps (Windows)
        if: matrix.platform == 'windows'
        working-directory: desktop
        shell: pwsh
        run: |
          # `create-dmg` is macOS-only and pulls `appdmg` (`os: darwin`),
          # which makes `npm ci` fail on Windows. The Windows installer path
          # only needs Tauri/NSIS, so remove the Mac-only dev tool in the
          # ephemeral runner checkout and keep platform optional deps intact.
          npm pkg delete devDependencies.create-dmg
          npm install --package-lock-only --ignore-scripts
          npm ci

      # ── macOS: import signing certificate into CI keychain ────────────────
      - name: Import Apple codesign certificate
        if: matrix.platform == 'darwin'
        env:
          CERTIFICATE_BASE64: ${{ secrets.CODESIGN_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CODESIGN_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo -n "$CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s \
            "$KEYCHAIN_PATH" \
            /Library/Keychains/System.keychain \
            /System/Library/Keychains/SystemRootCertificates.keychain
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      # ── macOS: AirNote.app + DMG + notarization ────────────────────────────
      - name: Build airnote-backend sidecar (Mac)
        if: matrix.platform == 'darwin'
        shell: bash
        timeout-minutes: 12
        run: |
          cargo build -p said-backend --release --target ${{ matrix.target }}
          mkdir -p desktop/src-tauri/binaries
          cp "target/${{ matrix.target }}/release/airnote-backend" \
            "desktop/src-tauri/binaries/airnote-backend-${{ matrix.target }}"
          chmod +x "desktop/src-tauri/binaries/airnote-backend-${{ matrix.target }}"

      - name: Build AirNote.app only (Mac)
        if: matrix.platform == 'darwin'
        shell: bash
        timeout-minutes: 20
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        working-directory: desktop
        run: |
          npm run tauri:build -- \
            --target ${{ matrix.target }} \
            --bundles app \
            --ci \
            --verbose \
            --no-sign

      - name: Sign and verify AirNote.app (Mac)
        if: matrix.platform == 'darwin'
        shell: bash
        timeout-minutes: 8
        env:
          APPLE_SIGNING_IDENTITY: "Developer ID Application: EMIAC TECHNOLOGIES LIMITED (96ZQGP7L3B)"
        run: |
          set -euo pipefail
          APP_PATH="target/${{ matrix.target }}/release/bundle/macos/${PRODUCT_NAME}.app"
          EMBEDDED_BACKEND="$APP_PATH/Contents/MacOS/airnote-backend"
          ENTITLEMENTS="desktop/src-tauri/AirNote.entitlements"
          BUNDLE_ID="com.emiac.airnote.desktop"

          test -d "$APP_PATH"
          test -x "$EMBEDDED_BACKEND"

          rm -f "$APP_PATH/Contents/MacOS/.env"
          xattr -cr "$APP_PATH" 2>/dev/null || true

          codesign --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" \
            --entitlements "$ENTITLEMENTS" \
            "$EMBEDDED_BACKEND"

          codesign --force --deep --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" \
            --entitlements "$ENTITLEMENTS" \
            "$APP_PATH"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --verify --strict --verbose=2 "$EMBEDDED_BACKEND"

          ACTUAL_ID=$(codesign -dv "$APP_PATH" 2>&1 | awk -F= '/^Identifier=/ {print $2}')
          test "$ACTUAL_ID" = "$BUNDLE_ID"
          echo "Signed app verified: $APP_PATH"

      - name: Create and verify DMG (Mac)
        if: matrix.platform == 'darwin'
        shell: bash
        timeout-minutes: 8
        env:
          APPLE_SIGNING_IDENTITY: "Developer ID Application: EMIAC TECHNOLOGIES LIMITED (96ZQGP7L3B)"
        run: |
          set -euo pipefail
          APP_PATH="target/${{ matrix.target }}/release/bundle/macos/${PRODUCT_NAME}.app"
          BUNDLE_DIR="target/${{ matrix.target }}/release/bundle"
          STAGING="$BUNDLE_DIR/dmg-staging"
          DMG_OUT="$BUNDLE_DIR/dmg/${PRODUCT_NAME}_${{ steps.ver_mac.outputs.version }}_${{ matrix.arch_short }}.dmg"

          rm -rf "$STAGING" "$DMG_OUT"
          mkdir -p "$STAGING" "$BUNDLE_DIR/dmg"
          ditto "$APP_PATH" "$STAGING/${PRODUCT_NAME}.app"
          ln -s /Applications "$STAGING/Applications"

          hdiutil create \
            -volname "$PRODUCT_NAME" \
            -srcfolder "$STAGING" \
            -ov \
            -format UDZO \
            "$DMG_OUT"

          rm -rf "$STAGING"
          test -f "$DMG_OUT"

          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$DMG_OUT"
          codesign -dv --verbose=2 "$DMG_OUT"

          ATTACH_OUT=$(hdiutil attach -nobrowse -readonly "$DMG_OUT")
          echo "$ATTACH_OUT"
          DMG_DEV=$(echo "$ATTACH_OUT" | awk '/\/dev\/disk[0-9]+s[0-9]+/ && /\/Volumes\// {print $1; exit}')
          DMG_VOL=$(echo "$ATTACH_OUT" | awk '/\/Volumes\// {for (i=3;i<=NF;i++) printf "%s%s", $i, (i<NF?" ":""); print ""; exit}')
          codesign --verify --deep --strict --verbose=2 "$DMG_VOL/${PRODUCT_NAME}.app"
          hdiutil detach "$DMG_DEV" -force >/dev/null
          echo "DMG verified: $DMG_OUT"

      - name: Notarize, staple, and verify DMG (Mac)
        if: matrix.platform == 'darwin'
        shell: bash
        timeout-minutes: 30
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: 96ZQGP7L3B
        run: |
          set -euo pipefail
          : "${APPLE_ID:?APPLE_ID secret is required for release notarization}"
          : "${APPLE_APP_SPECIFIC_PASSWORD:?APPLE_APP_SPECIFIC_PASSWORD secret is required for release notarization}"

          DMG_OUT="target/${{ matrix.target }}/release/bundle/dmg/${PRODUCT_NAME}_${{ steps.ver_mac.outputs.version }}_${{ matrix.arch_short }}.dmg"
          test -f "$DMG_OUT"

          defaults write com.apple.gke.notary.tool nt-upload-connection-timeout 300 || true

          xcrun notarytool submit "$DMG_OUT" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --timeout 25m \
            --wait \
            --verbose

          xcrun stapler staple "$DMG_OUT"
          spctl --assess --type open --context context:primary-signature -v "$DMG_OUT"
          echo "DMG is signed, notarized, stapled, and Gatekeeper-verified: $DMG_OUT"

      # ── Windows: sidecars + Tauri NSIS installer ──────────────────────────
      - name: Build AirNote.exe + NSIS installer (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pwsh scripts/build-windows.ps1 -RequireInstaller -RequireWhisper

      # ── Stage artifacts ────────────────────────────────────────────────────
      - name: Stage release artifacts (Mac)
        if: matrix.platform == 'darwin'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          mkdir -p release-artifacts
          cp "target/${{ matrix.target }}/release/bundle/dmg/${PRODUCT_NAME}_${{ steps.ver_mac.outputs.version }}_${{ matrix.arch_short }}.dmg" release-artifacts/

          UPDATE_TAR="${PRODUCT_NAME}_${{ steps.ver_mac.outputs.version }}_${{ matrix.arch_short }}.app.tar.gz"
          cd "target/${{ matrix.target }}/release/bundle/macos"
          tar czf "$UPDATE_TAR" "${PRODUCT_NAME}.app"
          mv "$UPDATE_TAR" "$GITHUB_WORKSPACE/release-artifacts/"
          cd "$GITHUB_WORKSPACE"

          cd desktop
          npx tauri signer sign \
            "$GITHUB_WORKSPACE/release-artifacts/$UPDATE_TAR" \
            --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          cd "$GITHUB_WORKSPACE"
          echo "Signature file:"
          ls -la "$GITHUB_WORKSPACE/release-artifacts/"*.sig || true

      - name: Stage release artifacts (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          $nsis = "target/${{ matrix.target }}/release/bundle/nsis"
          Get-ChildItem $nsis -Filter "${env:PRODUCT_NAME}_*-setup.exe"          | ForEach-Object { Copy-Item $_.FullName release-artifacts/ }
          Get-ChildItem $nsis -Filter "${env:PRODUCT_NAME}_*-setup.exe.sig"      | ForEach-Object { Copy-Item $_.FullName release-artifacts/ }

          Write-Host "── staged windows artifacts ──"
          Get-ChildItem release-artifacts | Format-List Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: release-artifacts/
          retention-days: 7

  deploy-vm:
    name: Compose manifest and deploy to VM
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read workspace version
        id: ver
        run: |
          VERSION=$(awk '
            /^\[workspace\.package\]/ { in_section = 1; next }
            /^\[/                     { in_section = 0 }
            in_section && /^[[:space:]]*version[[:space:]]*=/ {
              gsub(/.*=[[:space:]]*"/, ""); gsub(/".*/, ""); print; exit
            }
          ' Cargo.toml)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "workspace version: $VERSION"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten and checksum
        working-directory: artifacts
        run: |
          find . -mindepth 2 -type f -exec mv -f {} . \;
          find . -mindepth 1 -type d -empty -delete
          sha256sum * | sort -k 2 > SHA256SUMS
          echo "── released files ──"
          ls -lh

      - name: Generate updater manifests (per-target + combined)
        id: manifest
        working-directory: artifacts
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          PRODUCT_NAME="${PRODUCT_NAME:-AirNote}"
          BASE_URL="${PUBLIC_BASE_URL}/releases/${VERSION}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          read_sig() { [ -f "$1" ] && cat "$1" || echo ""; }
          DARWIN_FILE="${PRODUCT_NAME}_${VERSION}_aarch64.app.tar.gz"
          # Tauri v2 NSIS updater artifact is the signed -setup.exe (+ .exe.sig).
          WINDOWS_FILE="${PRODUCT_NAME}_${VERSION}_x64-setup.exe"

          darwin_entry() {
            cat <<EOF
              "darwin-aarch64": {
                "signature": "$(read_sig "${DARWIN_FILE}.sig")",
                "url": "${BASE_URL}/${DARWIN_FILE}"
              }
          EOF
          }
          windows_entry() {
            cat <<EOF
              "windows-x86_64": {
                "signature": "$(read_sig "${WINDOWS_FILE}.sig")",
                "url": "${BASE_URL}/${WINDOWS_FILE}"
              }
          EOF
          }
          write_manifest() {
            cat > "$1" <<EOF
          {
            "version": "${VERSION}",
            "notes": "AirNote ${VERSION}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
          $2
            }
          }
          EOF
          }

          # Per-target manifests (only platforms built this run).
          [ -f "$DARWIN_FILE" ]  && write_manifest "darwin-latest.json"  "$(darwin_entry)"
          [ -f "$WINDOWS_FILE" ] && write_manifest "windows-latest.json" "$(windows_entry)"

          # Combined (legacy) manifest for clients on the old single endpoint.
          # Only on a FULL both-platform release, so a single-platform release
          # never rewrites it and break legacy clients.
          if [ -f "$DARWIN_FILE" ] && [ -f "$WINDOWS_FILE" ]; then
            write_manifest "latest.json" "$(darwin_entry),
          $(windows_entry)"
          fi

          echo "── manifests ──"; ls -la *.json; for f in *.json; do echo "-- $f --"; cat "$f"; done
          echo "manifest_url=${PUBLIC_BASE_URL}/updates/latest.json" >> "$GITHUB_OUTPUT"
          echo "dmg_url=${BASE_URL}/${PRODUCT_NAME}_${VERSION}_aarch64.dmg" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        timeout-minutes: 3
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?DEPLOY_HOST secret is required}"
          : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY secret is required}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload release to VM
        timeout-minutes: 10
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          KEEP_RELEASES: ${{ inputs.keep_releases }}
        run: |
          set -euo pipefail
          : "${DEPLOY_USER:?DEPLOY_USER secret is required}"
          VERSION="${{ steps.ver.outputs.version }}"

          DEST="$DEPLOY_USER@$DEPLOY_HOST"
          ssh "$DEST" "mkdir -p '$REMOTE_RELEASE_ROOT/releases/$VERSION' '$REMOTE_RELEASE_ROOT/updates/darwin' '$REMOTE_RELEASE_ROOT/updates/windows'"
          scp artifacts/* "$DEST:$REMOTE_RELEASE_ROOT/releases/$VERSION/"
          # Per-target manifests — deploy only those built this run, so a
          # single-platform release leaves the other platform's manifest intact.
          if [ -f artifacts/darwin-latest.json ]; then
            scp artifacts/darwin-latest.json "$DEST:$REMOTE_RELEASE_ROOT/updates/darwin/latest.json"
          fi
          if [ -f artifacts/windows-latest.json ]; then
            scp artifacts/windows-latest.json "$DEST:$REMOTE_RELEASE_ROOT/updates/windows/latest.json"
          fi
          # Combined (legacy) endpoint — only present on a full release.
          if [ -f artifacts/latest.json ]; then
            scp artifacts/latest.json "$DEST:$REMOTE_RELEASE_ROOT/updates/latest.json"
          fi

          ssh "$DEPLOY_USER@$DEPLOY_HOST" "REMOTE_RELEASE_ROOT='$REMOTE_RELEASE_ROOT' KEEP_RELEASES='$KEEP_RELEASES' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$REMOTE_RELEASE_ROOT/releases"
          mapfile -t versions < <(find . -mindepth 1 -maxdepth 1 -type d -print | sed 's#^\./##' | sort -V)
          mapfile -t preserve_versions < <(python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["REMOTE_RELEASE_ROOT"])
          versions = set()
          for path in [
              root / "updates" / "darwin" / "latest.json",
              root / "updates" / "windows" / "latest.json",
              root / "updates" / "latest.json",
          ]:
              if not path.exists():
                  continue
              try:
                  data = json.loads(path.read_text())
              except Exception:
                  continue
              for entry in (data.get("platforms") or {}).values():
                  url = entry.get("url") if isinstance(entry, dict) else ""
                  match = re.search(r"/releases/([^/]+)/", url or "")
                  if match:
                      versions.add(match.group(1))
          for version in sorted(versions):
              print(version)
          PY
          )

          is_preserved_version() {
            local candidate="$1"
            local preserved
            for preserved in "${preserve_versions[@]}"; do
              [ "$candidate" = "$preserved" ] && return 0
            done
            return 1
          }

          current_count=${#versions[@]}
          if [ "$current_count" -gt "$KEEP_RELEASES" ]; then
            for old in "${versions[@]}"; do
              [ "$current_count" -le "$KEEP_RELEASES" ] && break
              if is_preserved_version "$old"; then
                echo "Preserving release still referenced by updater manifest: $old"
                continue
              fi
              echo "Pruning old release: $old"
              rm -rf -- "$old"
              current_count=$((current_count - 1))
            done
          fi
          REMOTE

          echo "VM release uploaded."

      - name: Verify public VM URLs
        timeout-minutes: 3
        run: |
          set -euo pipefail
          CURL_RESOLVE=(--resolve airnote.emiactech.com:443:103.180.163.41)
          # Verify whichever per-target manifests were published this run.
          for t in darwin windows; do
            if [ -f "artifacts/${t}-latest.json" ]; then
              url="${PUBLIC_BASE_URL}/updates/${t}/latest.json"
              echo "── $url ──"
              curl "${CURL_RESOLVE[@]}" --retry 5 --retry-delay 5 --retry-all-errors -fsS "$url"
            fi
          done
          if [ -f artifacts/latest.json ]; then
            curl "${CURL_RESOLVE[@]}" --retry 5 --retry-delay 5 --retry-all-errors -fsS "${{ steps.manifest.outputs.manifest_url }}" >/dev/null
            echo "Combined manifest OK: ${{ steps.manifest.outputs.manifest_url }}"
          fi

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: airnote-vm-release-${{ steps.ver.outputs.version }}
          path: artifacts/
          retention-days: 14
