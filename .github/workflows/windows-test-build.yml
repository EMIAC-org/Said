name: Windows Test Build

# Manual, artifact-only Windows installer build for hands-on testing.
#
# Produces a downloadable `AirNote_<ver>_x64-setup.exe` WITHOUT publishing a
# release and WITHOUT touching any update manifest (latest.json / beta.json) or
# the VM. Existing users — macOS or Windows — are never affected by this run.
#
# Use it to grab an installer to test on a real Windows machine. To actually
# ship to users, use the `Release` workflow (tag-driven) instead.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PRODUCT_NAME: AirNote

jobs:
  build:
    name: Build Windows installer (artifact only)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-test-build
          cache-targets: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop deps
        working-directory: desktop
        run: |
          # `create-dmg` is macOS-only and pulls `appdmg` (`os: darwin`),
          # which makes `npm ci` fail on Windows. The Windows installer path
          # only needs Tauri/NSIS, so remove the Mac-only dev tool in the
          # ephemeral runner checkout and keep platform optional deps intact.
          npm pkg delete devDependencies.create-dmg
          npm install --package-lock-only --ignore-scripts
          npm ci

      - name: Build airnote-backend sidecar
        shell: pwsh
        run: |
          # Package is still `said-backend`; the sidecar bin is `airnote-backend`
          # (matches externalBin in tauri.conf.json). Build just that bin.
          cargo build -p said-backend --bin airnote-backend --release --target x86_64-pc-windows-msvc
          New-Item -ItemType Directory -Force -Path desktop/src-tauri/binaries | Out-Null
          Copy-Item `
            "target/x86_64-pc-windows-msvc/release/airnote-backend.exe" `
            "desktop/src-tauri/binaries/airnote-backend-x86_64-pc-windows-msvc.exe"

      - name: Build AirNote.exe + NSIS installer
        working-directory: desktop
        env:
          # Signing the updater bundle is required because the updater plugin is
          # configured; it only writes a local .sig and publishes nothing.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build -- --target x86_64-pc-windows-msvc

      - name: Stage installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          $nsis = "target/x86_64-pc-windows-msvc/release/bundle/nsis"
          Get-ChildItem $nsis -Filter "${env:PRODUCT_NAME}_*-setup.exe" | ForEach-Object { Copy-Item $_.FullName installer/ }
          Write-Host "── staged installer ──"
          Get-ChildItem installer | Format-List Name, Length

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirNote-windows-test-installer
          path: installer/
          retention-days: 7
