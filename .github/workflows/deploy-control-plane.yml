name: Deploy Control Plane

on:
  push:
    branches: [main]
    paths:
      - "crates/control-plane/**"
      - "deploy/control-plane/**"
      - ".github/workflows/deploy-control-plane.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-control-plane
  cancel-in-progress: true

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Compute image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/airnote-control-plane"
          sha_tag="${image}:sha-${GITHUB_SHA::12}"
          {
            echo "image=${image}"
            echo "image_tag=${sha_tag}"
            echo "tags<<EOF"
            echo "${sha_tag}"
            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              echo "${image}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/control-plane/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=control-plane
          cache-to: type=gha,mode=max,scope=control-plane

  deploy:
    name: Deploy over SSH
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Validate deploy secrets
        shell: bash
        run: |
          test -n "${{ secrets.DEPLOY_HOST }}" || (echo "DEPLOY_HOST is missing" && exit 1)
          test -n "${{ secrets.DEPLOY_USER }}" || (echo "DEPLOY_USER is missing" && exit 1)
          test -n "${{ secrets.DEPLOY_SSH_KEY }}" || (echo "DEPLOY_SSH_KEY is missing" && exit 1)
          test -n "${{ secrets.DEPLOY_PATH }}" || (echo "DEPLOY_PATH is missing" && exit 1)
          test -n "${{ secrets.LARK_APP_ID }}" || (echo "LARK_APP_ID is missing" && exit 1)
          test -n "${{ secrets.LARK_APP_SECRET }}" || (echo "LARK_APP_SECRET is missing" && exit 1)
          test -n "${{ secrets.LARK_REDIRECT_URI }}" || (echo "LARK_REDIRECT_URI is missing" && exit 1)
          test -n "${{ secrets.RUNTIME_CREDENTIALS_KEY }}" || (echo "RUNTIME_CREDENTIALS_KEY is missing" && exit 1)

      - name: Configure SSH
        shell: bash
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload compose files
        shell: bash
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_REDIRECT_URI: ${{ secrets.LARK_REDIRECT_URI }}
          RUNTIME_CREDENTIALS_KEY: ${{ secrets.RUNTIME_CREDENTIALS_KEY }}
        run: |
          tar -C deploy/control-plane -czf /tmp/airnote-control-plane-deploy.tgz \
            docker-compose.yml Caddyfile README.md .env.example
          {
            printf 'LARK_APP_ID=%s\n' "$LARK_APP_ID"
            printf 'LARK_APP_SECRET=%s\n' "$LARK_APP_SECRET"
            printf 'LARK_REDIRECT_URI=%s\n' "$LARK_REDIRECT_URI"
            printf 'RUNTIME_CREDENTIALS_KEY=%s\n' "$RUNTIME_CREDENTIALS_KEY"
          } > /tmp/airnote-control-plane-secrets.env
          chmod 600 /tmp/airnote-control-plane-secrets.env
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mkdir -p '${{ secrets.DEPLOY_PATH }}'"
          scp /tmp/airnote-control-plane-deploy.tgz \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/deploy.tgz"
          scp /tmp/airnote-control-plane-secrets.env \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/deploy-secrets.env"

      - name: Pull image and restart stack
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: |
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}' IMAGE_TAG='$IMAGE_TAG' GHCR_USER='$GHCR_USER' GHCR_TOKEN='$GHCR_TOKEN' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          tar xzf deploy.tgz
          rm -f deploy.tgz

          if [ ! -f .env ]; then
            cp .env.example .env
            echo "Created $DEPLOY_PATH/.env. Fill it with production secrets, then rerun deploy."
            exit 2
          fi

          python3 - <<'PY'
          import os
          from pathlib import Path

          env_path = Path(".env")
          secret_path = Path("deploy-secrets.env")
          updates = {
              "CONTROL_PLANE_IMAGE": os.environ["IMAGE_TAG"],
              "CONTROL_PLANE_BIND": "127.0.0.1",
          }

          for line in secret_path.read_text().splitlines():
              if not line.strip() or line.lstrip().startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              updates[key] = value

          lines = env_path.read_text().splitlines()
          out = []
          seen = set()
          for line in lines:
              if "=" in line and not line.lstrip().startswith("#"):
                  key = line.split("=", 1)[0]
                  if key in updates:
                      out.append(f"{key}={updates[key]}")
                      seen.add(key)
                      continue
              out.append(line)

          for key, value in updates.items():
              if key not in seen:
                  out.append(f"{key}={value}")

          env_path.write_text("\n".join(out) + "\n")
          secret_path.unlink(missing_ok=True)
          PY

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker compose pull control-plane
          docker compose up -d --force-recreate control-plane
          CID=$(docker compose ps -q control-plane)
          for key in LARK_APP_ID LARK_APP_SECRET LARK_REDIRECT_URI RUNTIME_CREDENTIALS_KEY; do
            docker inspect "$CID" --format '{{range .Config.Env}}{{println .}}{{end}}' \
              | grep -q "^${key}=." || (echo "$key was not propagated into the control-plane container" && exit 1)
          done
          docker compose ps
          docker image prune -f
          REMOTE

      - name: Verify Lark OAuth redirect
        shell: bash
        run: |
          location="$(curl --resolve airnote.emiactech.com:443:103.180.163.41 \
            --retry 5 --retry-delay 3 --retry-all-errors \
            -fsSI 'https://airnote.emiactech.com/auth/lark?callback_port=55992' \
            | tr -d '\r' | awk 'tolower($1)=="location:" {print $2}' | tail -n 1)"
          test -n "$location" || (echo "OAuth redirect location missing" && exit 1)
          echo "$location" | grep -q 'app_id=[^&]' || (echo "OAuth redirect has empty app_id" && exit 1)
          echo "$location" | grep -q 'state=desktop\.' || (echo "OAuth redirect is not using desktop JWT state" && exit 1)
