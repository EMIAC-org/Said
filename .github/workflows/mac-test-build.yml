name: Mac Test Build (no publish)

# Manually-triggered, NON-PUBLISHING macOS build for local testing.
# Builds + Developer-ID-signs AirNote.app + a DMG and uploads it as a workflow
# artifact. Does NOT create a release, write latest.json/beta.json, bump a
# manifest, or notify any shipped client in any way.
#
# Signed with the EMIAC Developer ID AND notarized + stapled, so the DMG opens
# with no Gatekeeper friction. Still NON-PUBLISHING: artifact only, no release,
# no latest.json/beta.json, no manifest bump.
#
# Dispatch by pushing the current branch state to `ci/mac-test` (the push trigger
# below); anugra pushes never trigger it (wrong branch).

on:
  push:
    branches: ['ci/mac-test']
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PRODUCT_NAME: AirNote

jobs:
  build:
    name: Build AirNote DMG (test, aarch64)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Read workspace version
        id: ver
        shell: bash
        run: |
          VERSION=$(awk '
            /^\[workspace\.package\]/ { in_section = 1; next }
            /^\[/                     { in_section = 0 }
            in_section && /^[[:space:]]*version[[:space:]]*=/ {
              gsub(/.*=[[:space:]]*"/, ""); gsub(/".*/, ""); print; exit
            }
          ' Cargo.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "workspace version: $VERSION"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: mac-test-aarch64-apple-darwin
          cache-targets: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Import Apple codesign certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.CODESIGN_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CODESIGN_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo -n "$CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s \
            "$KEYCHAIN_PATH" \
            /Library/Keychains/System.keychain \
            /System/Library/Keychains/SystemRootCertificates.keychain
          security find-identity -v -p codesigning

      - name: Build airnote-backend sidecar
        timeout-minutes: 15
        run: |
          cargo build -p said-backend --release --target aarch64-apple-darwin
          mkdir -p desktop/src-tauri/binaries
          cp "target/aarch64-apple-darwin/release/airnote-backend" \
            "desktop/src-tauri/binaries/airnote-backend-aarch64-apple-darwin"
          chmod +x "desktop/src-tauri/binaries/airnote-backend-aarch64-apple-darwin"

      - name: Build whisper-cli sidecar
        timeout-minutes: 20
        run: |
          scripts/build-whisper-cli.sh aarch64-apple-darwin
          mkdir -p desktop/src-tauri/binaries
          cp "target/aarch64-apple-darwin/release/whisper-cli" \
            "desktop/src-tauri/binaries/whisper-cli-aarch64-apple-darwin"
          chmod +x "desktop/src-tauri/binaries/whisper-cli-aarch64-apple-darwin"

      - name: Build AirNote.app
        timeout-minutes: 25
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        working-directory: desktop
        run: |
          npm run tauri:build -- \
            --target aarch64-apple-darwin \
            --bundles app \
            --ci \
            --verbose \
            --no-sign

      - name: Sign AirNote.app
        timeout-minutes: 8
        env:
          APPLE_SIGNING_IDENTITY: "Developer ID Application: EMIAC TECHNOLOGIES LIMITED (96ZQGP7L3B)"
        run: |
          set -euo pipefail
          APP_PATH="target/aarch64-apple-darwin/release/bundle/macos/${PRODUCT_NAME}.app"
          EMBEDDED_BACKEND="$APP_PATH/Contents/MacOS/airnote-backend"
          EMBEDDED_WHISPER="$APP_PATH/Contents/MacOS/whisper-cli"
          ENTITLEMENTS="desktop/src-tauri/AirNote.entitlements"
          BUNDLE_ID="com.emiac.airnote.desktop"
          test -d "$APP_PATH"
          test -x "$EMBEDDED_BACKEND"
          test -x "$EMBEDDED_WHISPER"
          rm -f "$APP_PATH/Contents/MacOS/.env"
          mkdir -p "$APP_PATH/Contents/Resources/models"
          cp target/whisper-models/ggml-silero-*.bin "$APP_PATH/Contents/Resources/models/"
          xattr -cr "$APP_PATH" 2>/dev/null || true
          codesign --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" \
            --entitlements "$ENTITLEMENTS" \
            "$EMBEDDED_WHISPER"
          codesign --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" \
            --entitlements "$ENTITLEMENTS" \
            "$EMBEDDED_BACKEND"
          codesign --force --deep --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" \
            --entitlements "$ENTITLEMENTS" \
            "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --verify --strict --verbose=2 "$EMBEDDED_WHISPER"
          ACTUAL_ID=$(codesign -dv "$APP_PATH" 2>&1 | awk -F= '/^Identifier=/ {print $2}')
          test "$ACTUAL_ID" = "$BUNDLE_ID"
          echo "Signed app verified: $APP_PATH"

      - name: Create and sign DMG
        timeout-minutes: 8
        env:
          APPLE_SIGNING_IDENTITY: "Developer ID Application: EMIAC TECHNOLOGIES LIMITED (96ZQGP7L3B)"
        run: |
          set -euo pipefail
          APP_PATH="target/aarch64-apple-darwin/release/bundle/macos/${PRODUCT_NAME}.app"
          BUNDLE_DIR="target/aarch64-apple-darwin/release/bundle"
          STAGING="$BUNDLE_DIR/dmg-staging"
          DMG_OUT="$BUNDLE_DIR/dmg/${PRODUCT_NAME}_${{ steps.ver.outputs.version }}_aarch64-test.dmg"
          rm -rf "$STAGING" "$DMG_OUT"
          mkdir -p "$STAGING" "$BUNDLE_DIR/dmg"
          ditto "$APP_PATH" "$STAGING/${PRODUCT_NAME}.app"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create \
            -volname "$PRODUCT_NAME" \
            -srcfolder "$STAGING" \
            -ov \
            -format UDZO \
            "$DMG_OUT"
          rm -rf "$STAGING"
          test -f "$DMG_OUT"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$DMG_OUT"
          codesign -dv --verbose=2 "$DMG_OUT"
          echo "DMG created + signed: $DMG_OUT"

      - name: Notarize and staple DMG
        timeout-minutes: 30
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: 96ZQGP7L3B
        run: |
          set -euo pipefail
          : "${APPLE_ID:?APPLE_ID secret required for notarization}"
          : "${APPLE_APP_SPECIFIC_PASSWORD:?APPLE_APP_SPECIFIC_PASSWORD secret required}"
          DMG_OUT="target/aarch64-apple-darwin/release/bundle/dmg/${PRODUCT_NAME}_${{ steps.ver.outputs.version }}_aarch64-test.dmg"
          test -f "$DMG_OUT"
          defaults write com.apple.gke.notary.tool nt-upload-connection-timeout 300 || true
          xcrun notarytool submit "$DMG_OUT" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --timeout 25m \
            --wait \
            --verbose
          xcrun stapler staple "$DMG_OUT"
          spctl --assess --type open --context context:primary-signature -v "$DMG_OUT"
          echo "DMG signed, notarized, stapled, Gatekeeper-verified: $DMG_OUT"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirNote-test-dmg
          path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 5
          if-no-files-found: error
