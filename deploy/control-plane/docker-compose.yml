name: airnote-control-plane

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-said_control_plane}
      POSTGRES_USER: ${POSTGRES_USER:-said}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  control-plane:
    image: ${CONTROL_PLANE_IMAGE:?set CONTROL_PLANE_IMAGE in .env or CI environment}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      RUST_LOG: ${RUST_LOG:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-said}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-said_control_plane}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      LARK_APP_ID: ${LARK_APP_ID:-}
      LARK_APP_SECRET: ${LARK_APP_SECRET:-}
      LARK_REDIRECT_URI: ${LARK_REDIRECT_URI:-}
      OPENAI_CLIENT_ID: ${OPENAI_CLIENT_ID:-}
      OPENAI_REDIRECT_URI: ${OPENAI_REDIRECT_URI:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-}
      RUNTIME_CREDENTIALS_KEY: ${RUNTIME_CREDENTIALS_KEY:-}
      AIRNOTE_LEARNING_JUDGE_MODEL: ${AIRNOTE_LEARNING_JUDGE_MODEL:-}
      # DeepSeek remains available only to background learning/profile jobs.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      # Interactive dictation and every Option helper use Gemma 4 through this key.
      DEEPINFRA_API_KEY: ${DEEPINFRA_API_KEY:-}
      # Read-only cross-workspace Admin visibility for COMPANY_ADMIN members of
      # the internal platform workspace. Empty disables the global view.
      PLATFORM_ADMIN_ORG_SLUG: ${PLATFORM_ADMIN_ORG_SLUG:-emiactech}
    ports:
      - "${CONTROL_PLANE_BIND:-127.0.0.1}:${CONTROL_PLANE_PORT:-3100}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["caddy"]
    depends_on:
      control-plane:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN when using the caddy profile}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${RELEASES_PATH:-./releases}:/srv/airnote-releases:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
    name: ${POSTGRES_VOLUME_NAME:-airnote-control-plane_postgres-data}
  caddy-data:
  caddy-config:
