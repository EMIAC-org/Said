[workspace]
members = [
    "crates/core",
    "crates/recorder",
    "crates/paster",
    "crates/hotkey",
    "crates/backend",
    "crates/said",
    "desktop/src-tauri",
]
# control-plane excluded: it deploys to Fly.io and uses sqlx-postgres which
# conflicts with rusqlite's libsqlite3-sys linkage in the same resolver graph.
# Build it standalone: `cd crates/control-plane && cargo build`
exclude = ["crates/control-plane"]
resolver = "2"

# Shared package metadata. Member crates inherit by setting `field.workspace = true`.
# Bump `version` here (or via scripts/bump-version.sh) and every workspace crate
# moves with it. control-plane is excluded — keep its version in sync manually.
[workspace.package]
version      = "2.1.0"
edition      = "2024"
rust-version = "1.85"
authors      = ["EMIAC <https://github.com/EMIAC-org>"]
license      = "MIT"
repository   = "https://github.com/EMIAC-org/Said"
homepage     = "https://github.com/EMIAC-org/Said"
readme       = "README.md"

# Shared dependency versions across the workspace
[workspace.dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
uuid        = { version = "1", features = ["v4"] }
tokio       = { version = "1", features = ["full"] }
reqwest     = { version = "0.12", features = ["json", "multipart", "stream"] }
tracing     = "0.1"
dotenvy     = "0.15"

[profile.release]
opt-level = "z"
lto       = true
strip     = true

# Workspace-wide lint policy. Members inherit via `lints.workspace = true`.
# Strategy: keep clippy's correctness, suspicious, and complexity lints strict
# (the defaults), but opt out of style/pedantic categories that are noisy on a
# real codebase and don't catch bugs.
[workspace.lints.rust]
# objc 0.2's msg_send! macro emits cfg(cargo-clippy) checks that modern rustc
# rejects under the cfg-check feature. Until objc bumps, this is unfixable.
unexpected_cfgs = "allow"
# In-flight infrastructure constants/helpers (unused keycodes, FFI helpers
# held for adjacent features) shouldn't fail CI. Manual review during PR
# catches the dead code that actually matters.
dead_code = "allow"

[workspace.lints.clippy]
collapsible_if              = "allow"
doc_lazy_continuation       = "allow"
doc_overindented_list_items = "allow"
manual_char_comparison      = "allow"
too_many_arguments          = "allow"
type_complexity             = "allow"
